function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtMoney(n){return(n!=null&&n!=="")?"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"—";}
function fmtPct(n){return n!=null?(n>0?"+":"")+Number(n).toFixed(1)+"%":"—";}
function fmtDate(s){return s?new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"}):"—";}
function lsGet(k){try{var v=localStorage.getItem(k);return v?{value:v}:null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var _sbUrl=null,_sbKey=null;
function sbInit(){_sbUrl=localStorage.getItem("cv_sb_url");_sbKey=localStorage.getItem("cv_sb_key");}
function sbReady(){return!!(_sbUrl&&_sbKey);}
async function sbGet(table,profile){
  if(!sbReady())return null;
  try{
    var r=await fetch(_sbUrl+"/rest/v1/"+table+"?profile=eq."+encodeURIComponent(profile)+"&select=data",{headers:{"apikey":_sbKey,"Authorization":"Bearer "+_sbKey}});
    var rows=await r.json();
    return(rows&&rows.length>0&&rows[0].data)?rows[0].data:null;
  }catch(e){return null;}
}
async function sbSet(table,profile,data){
  if(!sbReady())return;
  try{
    await fetch(_sbUrl+"/rest/v1/"+table,{method:"POST",headers:{"apikey":_sbKey,"Authorization":"Bearer "+_sbKey,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},body:JSON.stringify({id:table+"_"+profile,profile:profile,data:data,updated_at:new Date().toISOString()})});
  }catch(e){}
}
async function sbMerge(table,profile,localCards){
  if(!sbReady()){return;}
  try{
    var cloud=await sbGet(table,profile);
    var merged=localCards.slice();
    if(cloud&&Array.isArray(cloud)){
      var ids=new Set(localCards.map(function(c){return c.id;}));
      cloud.forEach(function(c){if(!ids.has(c.id))merged.push(c);});
    }
    await sbSet(table,profile,merged);
    lsSet("cv_"+profile+"_inventory",JSON.stringify(merged));
  }catch(e){await sbSet(table,profile,localCards);}
}
async function testSb(url,key){
  var r=await fetch(url+"/rest/v1/cards?limit=1",{headers:{"apikey":key,"Authorization":"Bearer "+key}});
  if(!r.ok)throw new Error(await r.text());
}

async function apiCall(key,messages,useSearch){
  var body={model:"claude-sonnet-4-6",max_tokens:1500,messages:messages};
  if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
  var d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d;
}
function getText(data){return(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");}
function parseJSON(txt,open,close){var s=txt.indexOf(open),e=txt.lastIndexOf(close);if(s===-1||e===-1)return null;try{return JSON.parse(txt.slice(s,e+1));}catch(e){return null;}}

async function identifyCards(key,b64,mime){
  var prompt='Identify every graded sports card in this photo. Output ONLY a raw JSON array, no markdown. Each object: {playerName,year,brand,set,gradingCompany,grade,isRookie,isAuto,isPatch,isSerialNumbered,printRun,certNumber,bgsCenter,bgsCorners,bgsEdges,bgsSurface,_unclear}. Rules: gradingCompany=PSA/BGS/SGC/CGC. Read each label independently. PSA cert=numeric label. BGS cert=barcode area (starts 00). NEVER guess cert — if unreadable set null and add field to _unclear[]. BGS: read 4 subgrades. Return [] if none found.';
  var data=await apiCall(key,[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mime,data:b64}},{type:"text",text:prompt}]}],false);
  return parseJSON(getText(data),"[","]")||[];
}
async function lookupPrice(key,card){
  var q=card.year+" "+card.brand+" "+card.set+" "+card.playerName+" "+card.gradingCompany+" "+card.grade;
  var data=await apiCall(key,[{role:"user",content:'Search eBay completed listings for sold prices of: "'+q+'". Return ONLY JSON: {"lastSalePrice":number_or_null,"lastSaleDate":"YYYY-MM-DD_or_null","avgRecentPrice":number_or_null,"salesFound":boolean}'}],true);
  return parseJSON(getText(data),"{","}")||null;
}
async function lookupWatchlist(key,query){
  var data=await apiCall(key,[{role:"user",content:'Search eBay sold listings for: "'+query+'". Return ONLY JSON: {"lastSalePrice":number_or_null,"lastSaleDate":"YYYY-MM-DD_or_null","avgRecentPrice":number_or_null,"lowestAsk":number_or_null,"salesFound":boolean,"verdict":"good_buy"|"fair"|"overpriced"|"unknown","verdictReason":"one sentence"}'}],true);
  return parseJSON(getText(data),"{","}")||null;
}

function alertOf(card){
  if(!card.purchasePrice||!card.lastSalePrice)return"normal";
  var pct=((card.lastSalePrice-card.purchasePrice)/card.purchasePrice)*100;
  var gain=card.lastSalePrice-card.purchasePrice;
  if(gain<25)return"normal";
  if(pct>=25)return"urgent_sale";
  if(pct>=10)return"time_to_sell";
  return"normal";
}
function unrealGL(card){
  if(!card.purchasePrice)return null;
  var mkt=parseFloat(card.estimatedValue||card.lastSalePrice||0);
  if(!mkt)return null;
  var cost=parseFloat(card.purchasePrice);
  return{dollars:mkt-cost,pct:((mkt-cost)/cost)*100};
}
function realGL(card){
  if(!card.purchasePrice||!card.salePrice)return null;
  var p=parseFloat(card.salePrice)-parseFloat(card.purchasePrice);
  return{dollars:p,pct:(p/parseFloat(card.purchasePrice))*100};
}
function annROI(card){
  if(!card.purchasePrice||!card.salePrice||!card.purchaseDate||!card.saleDate)return null;
  var days=(new Date(card.saleDate)-new Date(card.purchaseDate))/(86400000);
  if(days<1)return null;
  var sr=(parseFloat(card.salePrice)-parseFloat(card.purchasePrice))/parseFloat(card.purchasePrice);
  return(Math.pow(1+sr,365/days)-1)*100;
}
function roiPct(card){
  if(!card.purchasePrice||!card.lastSalePrice)return null;
  return((card.lastSalePrice-card.purchasePrice)/card.purchasePrice)*100;
}
function holdSig(card){
  var r=roiPct(card);
  if(r==null)return"unknown";
  if(r>=25)return"sell";
  if(r>=10)return"watch";
  if(r>=0)return"hold";
  return"underwater";
}
function daysHeld(card){
  if(!card.purchaseDate)return null;
  var end=card.saleDate?new Date(card.saleDate):new Date();
  return Math.round((end-new Date(card.purchaseDate))/86400000);
}
function checkDups(newCards,existing){
  return newCards.map(function(nc){
    var ncCert=String(nc.certNumber||"").trim();
    var match=existing.find(function(ec){
      var ecCert=String(ec.certNumber||"").trim();
      if(ncCert&&ecCert)return ncCert===ecCert;
      return String(nc.playerName||"").toLowerCase().trim()===String(ec.playerName||"").toLowerCase().trim()&&String(nc.grade||"").trim()===String(ec.grade||"").trim()&&String(nc.gradingCompany||"").trim()===String(ec.gradingCompany||"").trim()&&String(nc.year||"").trim()===String(ec.year||"").trim()&&(!nc.set||!ec.set||String(nc.set||"").toLowerCase().trim()===String(ec.set||"").toLowerCase().trim());
    })||null;
    return{card:nc,existing:match,status:match?match.cardStatus||"inventory":null};
  });
}

function csvRow(vals){return vals.map(function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(",");}
function dlCSV(csv,fn){var blob=new Blob([csv],{type:"text/csv"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=fn;a.click();URL.revokeObjectURL(url);}
function exportInternal(cards){
  var h=["Player","Year","Brand","Set","Grading Co","Grade","Cert #","BGS Ctr","BGS Cor","BGS Edg","BGS Srf","RC","Auto","Patch","Serial","Print Run","Purchase Price","Purchase Date","Where","Last Sale Price","Last Sale Date","Unrealized G/L $","Unrealized G/L %","Realized G/L $","Realized G/L %","Simple ROI %","Annualized ROI %","Days Held","Sale Price","Sale Date","Alert","Status","Notes"];
  var rows=cards.map(function(c){
    var u=unrealGL(c),r=realGL(c),roi=roiPct(c),ar=annROI(c),dh=daysHeld(c);
    return csvRow([c.playerName||"",c.year||"",c.brand||"",c.set||"",c.gradingCompany||"",c.grade||"",c.certNumber||"",c.bgsCenter||"",c.bgsCorners||"",c.bgsEdges||"",c.bgsSurface||"",c.isRookie?"Yes":"No",c.isAuto?"Yes":"No",c.isPatch?"Yes":"No",c.isSerialNumbered?"Yes":"No",c.printRun||"",c.purchasePrice||"",c.purchaseDate||"",c.wherePurchased||"",c.lastSalePrice||"",c.lastSaleDate||"",u?u.dollars.toFixed(2):"",u?u.pct.toFixed(1)+"%":"",r?r.dollars.toFixed(2):"",r?r.pct.toFixed(1)+"%":"",roi!=null?roi.toFixed(1)+"%":"",ar!=null?ar.toFixed(1)+"%":"",dh||"",c.salePrice||"",c.saleDate||"",c.alertStatus||"normal",c.cardStatus||"inventory",c.notes||""]);
  });
  dlCSV([h.join(",")].concat(rows).join("\n"),"CardVault_Internal_"+new Date().toISOString().slice(0,10)+".csv");
}
function exportBuyer(cards){
  var now=new Date(),cut=new Date(now.getTime()-90*86400000);
  var active=cards.filter(function(c){return c.cardStatus==="inventory";});
  var h=["Player","Year","Brand","Set","Grading Co","Grade","Cert #","RC","Auto","Patch","BGS Subgrades","Market Value","# Sales (90 Days)","Trend","Condition Notes"];
  var rows=active.map(function(c){
    var mkt="",cnt="Insufficient data";
    if(c.lastSaleDate&&new Date(c.lastSaleDate)>=cut){mkt=c.estimatedValue||c.lastSalePrice||"";cnt=c.count30day?c.count30day+" (30d)":"1";}
    var trend="—";
    if(c.lastSalePrice&&c.purchasePrice){var ch=((c.lastSalePrice-c.purchasePrice)/c.purchasePrice)*100;trend=ch>5?"↑ Rising":ch<-5?"↓ Declining":"→ Stable";}
    var cond=c.gradingCompany==="BGS"&&c.bgsCenter?"BGS: Ctr "+c.bgsCenter+", Cor "+c.bgsCorners+", Edg "+c.bgsEdges+", Srf "+c.bgsSurface:c.gradingCompany+" "+c.grade+" — Straight Grade";
    return csvRow([c.playerName||"",c.year||"",c.brand||"",c.set||"",c.gradingCompany||"",c.grade||"",c.certNumber||"",c.isRookie?"Yes":"No",c.isAuto?"Yes":"No",c.isPatch?"Yes":"No",c.gradingCompany==="BGS"&&c.bgsCenter?c.bgsCenter+"/"+c.bgsCorners+"/"+c.bgsEdges+"/"+c.bgsSurface:"",mkt?"$"+parseFloat(mkt).toFixed(2):"Insufficient data",cnt,trend,cond]);
  });
  dlCSV([h.join(",")].concat(rows).join("\n"),"CardVault_Buyer_"+new Date().toISOString().slice(0,10)+".csv");
}

async function compressImg(dataUrl,maxPx,q){
  return new Promise(function(resolve,reject){
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){var s=maxPx/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        var ctx=cv.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        var out=cv.toDataURL("image/jpeg",q);
        resolve({b64:out.split(",")[1],mime:"image/jpeg",w:w,h:h});
      }catch(e){reject(e);}
    };
    img.onerror=function(){reject(new Error("load failed"));};
    img.src=dataUrl;
  });
}

  var h=holdSig(p.card);

function SetupScreen(p){
  var [key,setKey]=useState("");
  var [sbUrl,setSbUrl]=useState(localStorage.getItem("cv_sb_url")||"");
  var [sbKey,setSbKey]=useState(localStorage.getItem("cv_sb_key")||"");
  var [err,setErr]=useState("");
  var [busy,setBusy]=useState(false);
  async function save(){
    if(!key.trim()||!key.trim().startsWith("sk-ant-")){setErr("Enter a valid Anthropic API key (starts with sk-ant-)");return;}
    if(!sbUrl.trim()||!sbKey.trim()){setErr("Enter your Supabase Project URL and anon key");return;}
    setBusy(true);setErr("");
    try{
      await apiCall(key.trim(),[{role:"user",content:"Say OK"}],false);
      await testSb(sbUrl.trim(),sbKey.trim());
      localStorage.setItem("cv_sb_url",sbUrl.trim());
      localStorage.setItem("cv_sb_key",sbKey.trim());
      p.onSave(key.trim());
    }catch(e){setErr("Connection failed: "+e.message);}
    setBusy(false);
  }
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:C.bg}}>

function Dashboard(p){
  var cards=p.cards,mode=p.mode,onRefresh=p.onRefresh,onAdd=p.onAdd,refreshing=p.refreshing,prog=p.prog,lastRefresh=p.lastRefresh,onExport=p.onExport;
  var active=cards.filter(function(x){return x.cardStatus==="inventory";});
  var sold=cards.filter(function(x){return x.cardStatus==="sold";});
  var cost=active.reduce(function(s,x){return s+(parseFloat(x.purchasePrice)||0);},0);
  var val=active.reduce(function(s,x){return s+(parseFloat(x.estimatedValue||x.lastSalePrice||x.purchasePrice)||0);},0);
  var uDol=active.reduce(function(s,x){var u=unrealGL(x);return s+(u?u.dollars:0);},0);
  var uPct=cost>0?uDol/cost*100:null;
  var rDol=sold.reduce(function(s,x){var r=realGL(x);return s+(r?r.dollars:0);},0);
  var rCost=sold.reduce(function(s,x){return s+(parseFloat(x.purchasePrice)||0);},0);
  var rPct=rCost>0?rDol/rCost*100:null;
  var alerts=active.filter(function(x){return x.alertStatus!=="normal";});
  var sellNow=active.filter(function(x){return holdSig(x)==="sell";});
  var stats=[["In Inventory",active.length,C.gold],["Cost Basis",fmtMoney(cost),C.text],["Est. Value",fmtMoney(val),C.text],["Unrealized G/L",fmtMoney(uDol)+" "+fmtPct(uPct),uDol>=0?C.green:C.red],["Realized G/L",fmtMoney(rDol)+" "+fmtPct(rPct),rDol>=0?C.green:C.red],["Ready to Sell",sellNow.length,sellNow.length>0?C.green:C.text]];
  return(
    <div style={{padding:16,maxWidth:860,margin:"0 auto"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
        {stats.map(function(item){
          return(<div key={item[0]} style={{background:C.card,borderRadius:10,padding:"12px 14px",border:"1px solid "+C.border}}><div style={{fontSize:9,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:6}}>{item[0]}</div><div style={{fontSize:18,fontWeight:800,color:item[2],lineHeight:1}}>{item[1]}</div></div>);
        })}
      </div>
      <div style={{background:C.card,borderRadius:12,padding:"16px 18px",marginBottom:16,border:"1px solid "+C.border}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:4}}>🔄 Morning Price Refresh</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:12}}>{refreshing?"Checking "+prog.card+"… ("+prog.current+"/"+prog.total+")":lastRefresh?"Last run: "+lastRefresh:"Checks eBay sold for all "+active.length+" active cards"}</div>
        {refreshing&&<div style={{height:4,background:C.border,borderRadius:2,marginBottom:12,overflow:"hidden"}}><div style={{height:"100%",background:C.gold,width:(prog.total?prog.current/prog.total*100:0)+"%",transition:"width .3s"}}></div></div>}
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <button style={{...BO,borderColor:mode==="sell"?C.red:C.border,color:mode==="sell"?C.red:C.muted}} onClick={onAdd}>{mode==="sell"?"− Sell Card":"+ Add Card"}</button>
          <button style={{...BG,opacity:refreshing||!active.length?0.4:1}} onClick={onRefresh} disabled={refreshing||!active.length}>{refreshing?"Running…":"Run Refresh"}</button>
          <button style={BO} onClick={function(){onExport("internal");}}>⬇ Internal</button>
          <button style={BO} onClick={function(){onExport("buyer");}}>📋 Buyer Report</button>
        </div>
      </div>
      {alerts.length>0&&alerts.map(function(x){
        var pct=x.purchasePrice&&x.lastSalePrice?(x.lastSalePrice-x.purchasePrice)/x.purchasePrice*100:null;
        var urg=x.alertStatus==="urgent_sale";
        return(
          <div key={x.id} style={{background:C.card,border:"1px solid "+(urg?C.red:C.amber),borderRadius:10,padding:"14px 16px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <Badge bg={urg?C.red:C.amber} c="#fff" t={urg?"URGENT SALE":"TIME TO SELL"}/>
              <div style={{fontSize:16,fontWeight:800,marginTop:6}}>{x.playerName}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>{x.year} {x.brand} · {x.gradingCompany} {x.grade}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:4}}>Cost {fmtMoney(x.purchasePrice)} → Last {fmtMoney(x.lastSalePrice)}</div>
            </div>
            <div style={{fontSize:26,fontWeight:800,color:urg?C.red:C.amber,marginLeft:16}}>{fmtPct(pct)}</div>
          </div>
        );
      })}
      {alerts.length===0&&active.length>0&&<div style={{textAlign:"center",padding:40,color:C.muted}}><div style={{fontSize:28,marginBottom:10}}>📊</div><div style={{fontWeight:700}}>No alerts — run refresh to check prices</div></div>}
      {active.length===0&&<div style={{textAlign:"center",padding:48,color:C.muted}}><div style={{fontSize:32,marginBottom:12}}>🃏</div><div style={{fontWeight:700,marginBottom:16}}>No cards yet</div><button style={BG} onClick={onAdd}>+ Add Your First Card</button></div>}
    </div>
  );
}

function SellRank(p){
  var cards=p.cards,onView=p.onView;
  var active=cards.filter(function(x){return x.cardStatus==="inventory";});
  var ranked=active.filter(function(x){return x.purchasePrice;}).map(function(x){
    var roi=roiPct(x)||0,hvs=holdSig(x);
    var score=(hvs==="sell"?40:hvs==="watch"?20:0)+(x.alertStatus==="urgent_sale"?30:x.alertStatus==="time_to_sell"?15:0)+Math.min(roi,30);
    return Object.assign({},x,{_score:score,_roi:roi,_hvs:hvs});
  }).sort(function(a,b){return b._score-a._score;});
  function Sec(sp){
    if(!sp.cards||!sp.cards.length)return null;
    return(
      <div style={{marginBottom:20}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:10}}>{sp.title} ({sp.cards.length})</div>
        {sp.cards.map(function(x){
          var gain=x.purchasePrice&&x.lastSalePrice?x.lastSalePrice-x.purchasePrice:null;
          return(
            <div key={x.id} style={{background:C.card,borderRadius:10,padding:"12px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",border:"1px solid "+C.border}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:6,marginBottom:4}}><HoldBadge card={x}/>{x.alertStatus!=="normal"&&<Badge bg={x.alertStatus==="urgent_sale"?C.red:C.amber} c="#fff" t={x.alertStatus==="urgent_sale"?"URGENT":"ALERT"}/>}</div>
                <div style={{fontSize:15,fontWeight:800}}>{x.playerName}</div>
                <div style={{fontSize:11,color:C.muted}}>{x.year} {x.brand} · {x.gradingCompany} {x.grade}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:3}}>Cost {fmtMoney(x.purchasePrice)} · Last {fmtMoney(x.lastSalePrice)}{gain!=null&&<span style={{color:gain>=0?C.green:C.red,fontWeight:700}}> · {gain>=0?"+":""}{fmtMoney(gain)}</span>}</div>
              </div>
              <button onClick={function(){onView(x);}} style={{...BO,padding:"5px 12px",fontSize:11,marginLeft:10}}>View</button>
            </div>
          );
        })}
      </div>
    );
  }
  if(!active.length)return <div style={{textAlign:"center",padding:48,color:C.muted}}><div style={{fontSize:28,marginBottom:10}}>📋</div><div style={{fontWeight:700}}>No cards in inventory</div></div>;
  return(
    <div style={{padding:16,maxWidth:860,margin:"0 auto"}}>
      <div style={{background:C.card,borderRadius:12,padding:"14px 18px",marginBottom:20,border:"1px solid "+C.border}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:4}}>🎯 Sell Recommendation Engine</div>
        <div style={{fontSize:12,color:C.muted}}>Cards ranked by ROI and alert status. Run a price refresh first for best results.</div>
      </div>
      <Sec title="🟢 Sell Now" cards={ranked.filter(function(x){return x._hvs==="sell";})}/>
      <Sec title="⚡ Consider Selling" cards={ranked.filter(function(x){return x._hvs==="watch";})}/>
      <Sec title="⏳ Hold" cards={ranked.filter(function(x){return x._hvs==="hold";})}/>
      <Sec title="🔴 Underwater" cards={ranked.filter(function(x){return x._hvs==="underwater";})}/>
      <Sec title="❓ No Price Data" cards={ranked.filter(function(x){return x._hvs==="unknown";})}/>
    </div>
  );
}

function WatchlistView(p){
  var apiKey=p.apiKey,watchlist=p.watchlist,setWatchlist=p.setWatchlist,toast=p.toast;
  var [query,setQuery]=useState("");
  var [target,setTarget]=useState("");
  var [checking,setChecking]=useState(null);
  function add(){
    if(!query.trim()){toast("Enter a card to watch","error");return;}
    var item={id:uid(),query:query.trim(),targetPrice:parseFloat(target)||null,addedDate:new Date().toISOString().slice(0,10),lastSalePrice:null,lastSaleDate:null,avgRecentPrice:null,lowestAsk:null,verdict:null,verdictReason:null,lastChecked:null};
    setWatchlist(watchlist.concat([item]));
    lsSet("cv_watchlist",JSON.stringify(watchlist.concat([item])));
    setQuery("");setTarget("");toast("Added","success");
  }
  async function check(id){
    var item=watchlist.find(function(x){return x.id===id;});
    if(!item)return;
    setChecking(id);
    try{
      var r=await lookupWatchlist(apiKey,item.query);
      if(r){
        var updated=watchlist.map(function(x){return x.id===id?Object.assign({},x,r,{lastChecked:new Date().toISOString().slice(0,10)}):x;});
        setWatchlist(updated);lsSet("cv_watchlist",JSON.stringify(updated));
        toast("Updated","success");
      }else toast("No data found","error");
    }catch(e){toast("Error: "+e.message,"error");}
    setChecking(null);
  }
  function remove(id){
    var u=watchlist.filter(function(x){return x.id!==id;});
    setWatchlist(u);lsSet("cv_watchlist",JSON.stringify(u));
  }
  var vMap={good_buy:{bg:"#e8f5ee",c:C.green,l:"✅ Good Buy"},fair:{bg:"#fff8ee",c:C.amber,l:"⚡ Fair"},overpriced:{bg:"#fdecea",c:C.red,l:"❌ Overpriced"},unknown:{bg:C.surface,c:C.muted,l:"— Unknown"}};
  return(
    <div style={{padding:16,maxWidth:860,margin:"0 auto"}}>
      <div style={{background:C.card,borderRadius:12,padding:"16px 18px",marginBottom:16,border:"1px solid "+C.border}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:12}}>👀 Add to Watchlist</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
          <Fld l="Card description" s2={true}><Inp value={query} onChange={function(e){setQuery(e.target.value);}} placeholder="e.g. 2023 Panini Prizm Mahomes PSA 10"/></Fld>
          <Fld l="Target Buy Price"><Inp type="number" step="0.01" value={target} onChange={function(e){setTarget(e.target.value);}} placeholder="e.g. 150.00"/></Fld>
          <div style={{display:"flex",gap:8}}>
            <button style={BG} onClick={add}>+ Add</button>
            {watchlist.length>0&&<button style={BO} onClick={function(){watchlist.forEach(function(i){check(i.id);});}}>🔄 Check All</button>}
          </div>
        </div>
      </div>
      {!watchlist.length&&<div style={{textAlign:"center",padding:48,color:C.muted}}><div style={{fontSize:28,marginBottom:10}}>👀</div><div style={{fontWeight:700}}>No cards on watchlist</div></div>}
      {watchlist.map(function(item){
        var vc=vMap[item.verdict]||vMap.unknown;
        var below=item.targetPrice&&item.lastSalePrice&&item.lastSalePrice<=item.targetPrice;
        return(
          <div key={item.id} style={{background:C.card,borderRadius:12,padding:"14px 16px",marginBottom:10,border:"1px solid "+(below?C.green:C.border)}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div style={{flex:1}}>
                {below&&<div style={{marginBottom:6}}><Badge bg={C.green} c="#fff" t="🎯 AT OR BELOW TARGET"/></div>}
                <div style={{fontSize:15,fontWeight:800}}>{item.query}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>Added {fmtDate(item.addedDate)}{item.lastChecked?" · Checked "+fmtDate(item.lastChecked):""}</div>
              </div>
              <div style={{display:"flex",gap:8,marginLeft:10}}>
                <button onClick={function(){check(item.id);}} disabled={checking===item.id} style={{...BO,padding:"5px 10px",fontSize:11}}>{checking===item.id?"…":"🔄"}</button>
                <button onClick={function(){remove(item.id);}} style={{...BD,padding:"5px 10px",fontSize:11}}>✕</button>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:10}}>
              {[["Last Sale",fmtMoney(item.lastSalePrice)],["Avg Recent",fmtMoney(item.avgRecentPrice)],["Lowest Ask",fmtMoney(item.lowestAsk)],["Target",fmtMoney(item.targetPrice)]].map(function(it){
                return(<div key={it[0]} style={{background:C.surface,borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:C.muted,marginBottom:4}}>{it[0]}</div><div style={{fontSize:14,fontWeight:800}}>{it[1]}</div></div>);
              })}
            </div>
            {item.verdict&&<div style={{padding:"8px 12px",borderRadius:8,background:vc.bg,display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:11,fontWeight:700,color:vc.c}}>{vc.l}</span>{item.verdictReason&&<span style={{fontSize:11,color:C.muted}}>— {item.verdictReason}</span>}</div>}
          </div>
        );
      })}
    </div>
  );
}

function AddModal(p){
  var apiKey=p.apiKey,mode=p.mode,myCards=p.myCards,onAdd=p.onAdd,onSellBulk=p.onSellBulk,onAddAndSell=p.onAddAndSell,onClose=p.onClose,toast=p.toast;
  var [tab,setTab]=useState("photo");
  var [img,setImg]=useState(null);
  var [b64,setB64]=useState(null);
  var [mime,setMime]=useState(null);
  var [imgInfo,setImgInfo]=useState("");
  var [busy,setBusy]=useState(false);
  var [status,setStatus]=useState("");
  var [identified,setIdentified]=useState([]);
  var [pci,setPci]=useState([]);
  var [dups,setDups]=useState([]);
  var [dupConf,setDupConf]=useState({});
  var [matched,setMatched]=useState([]);
  var [form,setForm]=useState(Object.assign({},BLANK));
  var [saleInfo,setSaleInfo]=useState({price:"",date:new Date().toISOString().slice(0,10)});
  var [selIds,setSelIds]=useState({});
  var [addSell,setAddSell]=useState({});
  var [addSellInfo,setAddSellInfo]=useState({});
  var fileRef=useRef();
  function upd(k,v){setForm(function(prev){return Object.assign({},prev,{[k]:v});});}
  function handleFile(f){
    if(!f)return;
    setStatus("Compressing…");
    var r=new FileReader();
    r.onload=async function(e){
      var raw=e.target.result;setImg(raw);
      try{
        var c1=await compressImg(raw,900,0.78);
        var fb=c1.b64,sz=Math.round(c1.b64.length*0.75/1024);
        if(sz>350){var c2=await compressImg(raw,600,0.65);fb=c2.b64;sz=Math.round(c2.b64.length*0.75/1024);}
        setB64(fb);setMime("image/jpeg");setImgInfo(c1.w+"×"+c1.h+"px · ~"+sz+"KB");setStatus("Ready");
      }catch(err){setB64(raw.split(",")[1]);setMime(f.type||"image/jpeg");setStatus("Ready");}
    };
    r.readAsDataURL(f);
  }
  async function doIdentify(){
    if(!b64)return;
    setBusy(true);setStatus("Reading labels…");
    try{
      var cards=await identifyCards(apiKey,b64,mime);
      if(!cards.length){setStatus("No graded cards found");setBusy(false);return;}
      setStatus("Found "+cards.length+" card"+(cards.length!==1?"s":"")+"!");
      if(mode==="sell"){
        var m=cards.map(function(id){
          var match=myCards.find(function(c){
            if(c.cardStatus!=="inventory")return false;
            var nc=String(id.certNumber||"").trim(),ec=String(c.certNumber||"").trim();
            if(nc&&ec)return nc===ec;
            return(id.playerName||"").toLowerCase().includes((c.playerName||"").toLowerCase());
          })||null;
          return Object.assign({},id,{match:match});
        });
        setMatched(m);
        var s={};m.forEach(function(x){if(x.match)s[x.match.id]=true;});setSelIds(s);
      }else{
        setIdentified(cards);
        setPci(cards.map(function(){return{purchasePrice:"",purchaseDate:new Date().toISOString().slice(0,10),wherePurchased:"",grade:"",gradingCompany:"",certNumber:""};} ));
        setDups(checkDups(cards,myCards));
        setDupConf({});
      }
    }catch(e){setStatus("Error: "+e.message);toast("Error: "+e.message,"error");}
    setBusy(false);
  }
  function doAddAll(){
    var blocked=[],toAdd=[];
    identified.forEach(function(x,i){
      var info=pci[i]||{};
      var dup=dups[i];
      if(dup&&dup.existing){
        if(dup.status==="inventory"){blocked.push(x.playerName||"Card");return;}
        if(dup.status==="sold"&&!dupConf[x.certNumber||i])return;
      }
      toAdd.push(Object.assign({},BLANK,x,{id:uid(),addedDate:new Date().toISOString().slice(0,10),cardStatus:"inventory",alertStatus:"normal",lastSalePrice:null,lastSaleDate:null,estimatedValue:null,
        purchasePrice:info.purchasePrice||"",purchaseDate:info.purchaseDate||new Date().toISOString().slice(0,10),wherePurchased:info.wherePurchased||"",
        grade:info.grade||x.grade,gradingCompany:info.gradingCompany||x.gradingCompany,certNumber:info.certNumber||x.certNumber}));
    });
    if(blocked.length)toast(blocked.join(", ")+" already in inventory — skipped","error");
    if(toAdd.length){onAdd(toAdd);if(!blocked.length)onClose();}
  }
  function doSellMatched(){
    var ids=Object.keys(selIds).filter(function(k){return selIds[k];});
    var asc=matched.filter(function(m){return !m.match&&addSell[m.playerName+m.grade];});
    if(!ids.length&&!asc.length){toast("Select at least one card","error");return;}
    if(!saleInfo.price){toast("Enter a sale price","error");return;}
    if(asc.length){
      var toAdd=asc.map(function(m){
        var info=addSellInfo[m.playerName+m.grade]||{};

                })}
              </div>
              {card.notes&&<div style={{fontSize:13,color:C.muted,fontStyle:"italic",padding:"12px 16px",background:C.surface,borderRadius:10,marginBottom:14}}>{card.notes}</div>}
              <div style={{background:C.surface,borderRadius:10,padding:"14px 16px",marginBottom:12}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:10}}>Manual Last Sale Update</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <Fld l="Last Sale Price"><Inp type="number" step="0.01" placeholder="e.g. 3500.00" value={manualPrice} onChange={function(e){setManualPrice(e.target.value);}}/></Fld>
                  <Fld l="Sale Date"><Inp type="date" value={manualDate} onChange={function(e){setManualDate(e.target.value);}}/></Fld>
                </div>
                <button style={{...BG,padding:"8px 14px",fontSize:12}} onClick={function(){
                  if(!manualPrice)return;
                  var price=parseFloat(manualPrice);
                  var updated=Object.assign({},card,{lastSalePrice:price,lastSaleDate:manualDate||new Date().toISOString().slice(0,10),alertStatus:alertOf(Object.assign({},card,{lastSalePrice:price}))});
                  onUpdate(updated);setManualPrice("");
                }}>Save Last Sale Price</button>
              </div>
              <a href={searchUrl} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",background:C.goldBg,border:"1px solid "+C.gold,borderRadius:8,fontSize:12,fontWeight:700,color:C.gold}}>🔍 View on 130point</a>
            </div>
          ):<CardForm card={form} upd={upd}/>}
        </div>
        {editing&&(
          <div style={{display:"flex",gap:10,justifyContent:"space-between",padding:"16px 20px",borderTop:"1px solid "+C.border}}>
            <button style={{...BD,padding:"6px 12px",fontSize:12}} onClick={function(){if(window.confirm("Delete this card?"))onDelete(card.id);}}>🗑 Delete</button>
            <div style={{display:"flex",gap:10}}>
              <button style={BO} onClick={function(){setEditing(false);setForm(Object.assign({},card));}}>Cancel</button>
              <button style={BG} onClick={function(){onUpdate(form);}}>✓ Save</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function SettingsModal(p){
  var onClose=p.onClose,onResetKey=p.onResetKey;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:C.card,borderRadius:16,width:"100%",maxWidth:400,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+C.border}}>
          <div style={{fontSize:20,fontWeight:800}}>⚙ Settings</div>
          <button onClick={onClose} style={{...BO,padding:"6px 12px"}}>✕</button>
        </div>
        <div style={{padding:20}}>
          <div style={{background:C.surface,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>API Keys &amp; Sync</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:8}}>Reset to update your keys on this device.</div>
            <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Supabase: <strong>{(localStorage.getItem("cv_sb_url")||"Not configured").replace("https://","").slice(0,20)+"…"}</strong></div>
            <button style={{...BD,padding:"8px 14px",fontSize:12}} onClick={onResetKey}>Reset All Keys</button>
          </div>
          <div style={{background:C.surface,borderRadius:10,padding:"14px 16px"}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>About</div>
            <div style={{fontSize:12,color:C.muted,lineHeight:1.6}}>Dad &amp; Lad's Card Vault v1.5<br/>Graded card inventory tracker<br/>Data synced via Supabase</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  var [apiKey,setApiKey]=useState(null);
  var [profile,setProfile]=useState(null);
  var [view,setView]=useState("dashboard");
  var [mode,setMode]=useState("buy");
  var [dadCards,setDadCards]=useState([]);
  var [owenCards,setOwenCards]=useState([]);
  var [dadWL,setDadWL]=useState([]);
  var [owenWL,setOwenWL]=useState([]);
  var [loading,setLoading]=useState(true);
  var [toasts,setToasts]=useState([]);
  var [showAdd,setShowAdd]=useState(false);
  var [showSell,setShowSell]=useState(null);
  var [showDetail,setShowDetail]=useState(null);
  var [showSettings,setShowSettings]=useState(false);
  var [refreshing,setRefreshing]=useState(false);
  var [prog,setProg]=useState({current:0,total:0,card:""});
  var [lastRefresh,setLastRefresh]=useState(null);
  var [search,setSearch]=useState("");
  var [fAlert,setFAlert]=useState("all");
  var [fStatus,setFStatus]=useState("all");

  useEffect(function(){
    async function loadData(){
      try{
        var k=localStorage.getItem("cv_api_key");if(k)setApiKey(k);
        var d=lsGet("cv_dad_inventory");if(d)setDadCards(JSON.parse(d.value));
        var o=lsGet("cv_owen_inventory");if(o)setOwenCards(JSON.parse(o.value));
        var dw=lsGet("cv_dad_watchlist");if(dw)setDadWL(JSON.parse(dw.value));
        var ow=lsGet("cv_owen_watchlist");if(ow)setOwenWL(JSON.parse(ow.value));
        var lr=lsGet("cv_last_refresh");if(lr)setLastRefresh(lr.value);
      }catch(e){}
      setLoading(false);
      try{
        sbInit();
        if(sbReady()){
          var dd=await sbGet("cards","dad");var od=await sbGet("cards","owen");
          var ddw=await sbGet("watchlist","dad");var odw=await sbGet("watchlist","owen");
          if(dd){setDadCards(dd);lsSet("cv_dad_inventory",JSON.stringify(dd));}
          if(od){setOwenCards(od);lsSet("cv_owen_inventory",JSON.stringify(od));}
          if(ddw){setDadWL(ddw);lsSet("cv_dad_watchlist",JSON.stringify(ddw));}
          if(odw){setOwenWL(odw);lsSet("cv_owen_watchlist",JSON.stringify(odw));}
        }
      }catch(e){}
    }
    loadData();
  },[]);

  var myCards=profile==="dad"?dadCards:owenCards;
  var myWL=profile==="dad"?dadWL:owenWL;
  var otherCards=profile==="dad"?owenCards:dadCards;
  var otherName=profile==="dad"?"Lad":"Dad";

  function setMyWL(wl){
    if(profile==="dad")setDadWL(wl);else setOwenWL(wl);
    lsSet("cv_"+profile+"_watchlist",JSON.stringify(wl));
    sbSet("watchlist",profile,wl);
  }
  function saveCards(pr,cards){
    if(pr==="dad")setDadCards(cards);else setOwenCards(cards);
    lsSet("cv_"+pr+"_inventory",JSON.stringify(cards));
    sbMerge("cards",pr,cards);
  }
  function toast(msg,type){
    var id=uid();
    setToasts(function(t){return t.concat([{id:id,msg:msg,type:type||"info"}]);});
    setTimeout(function(){setToasts(function(t){return t.filter(function(x){return x.id!==id;});});},5000);
  }
  function addCards(cards){saveCards(profile,myCards.concat(cards));toast("Added "+cards.length+" card"+(cards.length!==1?"s":""),"success");}
  function updateCard(id,updates){saveCards(profile,myCards.map(function(x){return x.id===id?Object.assign({},x,updates):x;}));}
  function deleteCard(id){saveCards(profile,myCards.filter(function(x){return x.id!==id;}));setShowDetail(null);toast("Deleted","info");}
  function sellCard(id,sd){saveCards(profile,myCards.map(function(x){return x.id===id?Object.assign({},x,{cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"}):x;}));toast("Marked as sold","success");}
  function sellBulk(ids,sd){saveCards(profile,myCards.map(function(x){return ids.includes(x.id)?Object.assign({},x,{cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"}):x;}));}
  function addAndSellCards(newCards,sd){
    var toSell=newCards.map(function(c){return Object.assign({},c,{cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"});});
    saveCards(profile,myCards.concat(toSell));
    toast("Added and sold "+toSell.length+" card"+(toSell.length!==1?"s":""),"success");
  }
  function bulkSavePrices(updates){
    var updated=myCards.map(function(x){
      if(!updates[x.id])return x;
      var u=updates[x.id];
      var nc=Object.assign({},x,{lastSalePrice:u.lastSalePrice,lastSaleDate:u.lastSaleDate});
      nc.alertStatus=alertOf(nc);return nc;
    });
    saveCards(profile,updated);toast("Prices updated","success");
  }
  async function runRefresh(){
    var active=myCards.filter(function(x){return x.cardStatus==="inventory";});
    if(!active.length){toast("No active cards","info");return;}
    setRefreshing(true);var updated=myCards.slice();var alertCount=0;
    for(var i=0;i<active.length;i++){
      var card=active[i];
      setProg({current:i+1,total:active.length,card:card.playerName});
      try{
        var pr=await lookupPrice(apiKey,card);
        if(pr&&pr.salesFound&&pr.lastSalePrice){
          var existD=card.lastSaleDate||"",newD=pr.lastSaleDate||"";
          if(!existD||!newD||(newD>=existD)){
            var a=alertOf(Object.assign({},card,{lastSalePrice:pr.lastSalePrice}));
            if(a!=="normal")alertCount++;
            updated=updated.map(function(x){return x.id===card.id?Object.assign({},x,{lastSalePrice:pr.lastSalePrice,lastSaleDate:pr.lastSaleDate,estimatedValue:pr.avgRecentPrice||pr.lastSalePrice,alertStatus:a}):x;});
          }
        }
      }catch(e){}
      if(i<active.length-1)await new Promise(function(r){setTimeout(r,600);});
    }
    if(profile==="dad")setDadCards(updated.slice());else setOwenCards(updated.slice());
    lsSet("cv_"+profile+"_inventory",JSON.stringify(updated));
    sbSet("cards",profile,updated);
    var now=new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    lsSet("cv_last_refresh",now);setLastRefresh(now);
    setRefreshing(false);setProg({current:0,total:0,card:""});
    toast("Done · "+alertCount+" alert"+(alertCount!==1?"s":""),alertCount>0?"info":"success");
  }

  if(loading)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",fontSize:18,color:C.gold,fontWeight:700}}>Loading…</div>;
  if(!apiKey)return <SetupScreen onSave={function(k){localStorage.setItem("cv_api_key",k);setApiKey(k);}}/>;
  if(!profile)return <ProfileScreen counts={{dad:{inventory:dadCards.filter(function(c){return c.cardStatus==="inventory";}).length,sold:dadCards.filter(function(c){return c.cardStatus==="sold";}).length},owen:{inventory:owenCards.filter(function(c){return c.cardStatus==="inventory";}).length,sold:owenCards.filter(function(c){return c.cardStatus==="sold";}).length}}} onSelect={function(pr){setProfile(pr);setView("dashboard");}} onSettings={function(){setShowSettings(true);}}/>;

  return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      <Nav profile={profile} mode={mode} view={view} onMode={setMode} onView={function(v){setView(v);setSearch("");setFAlert("all");setFStatus("all");}} onSwitch={function(){setProfile(null);}}/>
      {view==="dashboard"&&<Dashboard cards={myCards} mode={mode} onRefresh={runRefresh} onAdd={function(){setShowAdd(true);}} refreshing={refreshing} prog={prog} lastRefresh={lastRefresh} onExport={function(type){if(type==="buyer"){exportBuyer(myCards);toast("Buyer report downloaded","success");}else{exportInternal(myCards);toast("Internal report downloaded","success");}}}/>}
      {(view==="inventory"||view==="browse")&&<InventoryView cards={view==="browse"?otherCards:myCards} onAdd={function(){setShowAdd(true);}} onSell={function(x){setShowSell(x);}} onView={function(x){setShowDetail(x);}} mode={mode} readOnly={view==="browse"} ownerName={otherName} search={search} setSearch={setSearch} fAlert={fAlert} setFAlert={setFAlert} fStatus={fStatus} setFStatus={setFStatus} onBulkSave={bulkSavePrices}/>}
      {view==="sell_rank"&&<SellRank cards={myCards} onView={function(x){setShowDetail(x);}}/>}
      {view==="watchlist"&&<WatchlistView apiKey={apiKey} watchlist={myWL} setWatchlist={setMyWL} toast={toast}/>}
      {showAdd&&<AddModal apiKey={apiKey} mode={mode} myCards={myCards} onAdd={addCards} onSellBulk={sellBulk} onAddAndSell={addAndSellCards} onClose={function(){setShowAdd(false);}} toast={toast}/>}
      {showSell&&<SellModal card={showSell} onSell={function(sd){sellCard(showSell.id,sd);setShowSell(null);}} onClose={function(){setShowSell(null);}}/>}
      {showDetail&&<DetailModal card={showDetail} readOnly={view==="browse"} onClose={function(){setShowDetail(null);}} onUpdate={function(u){updateCard(showDetail.id,u);setShowDetail(null);toast("Saved","success");}} onDelete={deleteCard}/>}
      {showSettings&&<SettingsModal onClose={function(){setShowSettings(false);}} onResetKey={function(){localStorage.removeItem("cv_api_key");localStorage.removeItem("cv_sb_url");localStorage.removeItem("cv_sb_key");setApiKey(null);setShowSettings(false);}}/>}
      <div style={{position:"fixed",bottom:20,right:20,display:"flex",flexDirection:"column",gap:8,zIndex:200,maxWidth:300}}>
        {toasts.map(function(t){return <div key={t.id} style={{background:C.card,borderLeft:"4px solid "+(t.type==="success"?C.green:t.type==="error"?C.red:C.gold),borderRadius:10,padding:"12px 16px",fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.15)"}}>{t.msg}</div>;})}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
</html>
