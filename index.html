var _sbUrl=null,_sbKey=null;
function sbInit(){
_sbUrl=localStorage.getItem("cv_sb_url");
_sbKey=localStorage.getItem("cv_sb_key");
}
function sbReady(){return !!(_sbUrl&&_sbKey);}

async function sbGet(table,profile){
if(!sbReady())return null;
try{
var url=_sbUrl+"/rest/v1/"+table+"?profile=eq."+encodeURIComponent(profile)+"&select=data";
var r=await fetch(url,{headers:{"apikey":_sbKey,"Authorization":"Bearer "+_sbKey,"Content-Type":"application/json"}});
var rows=await r.json();
if(rows&&rows.length>0&&rows[0].data)return rows[0].data;
return null;
}catch(e){console.log("sbGet error:",e.message);return null;}
}

async function sbSet(table,profile,data){
if(!sbReady())return;
try{
var url=_sbUrl+"/rest/v1/"+table;
var payload={id:table+"_"+profile,profile:profile,data:data,updated_at:new Date().toISOString()};
await fetch(url,{
method:"POST",
headers:{"apikey":_sbKey,"Authorization":"Bearer "+_sbKey,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
body:JSON.stringify(payload)
});
}catch(e){console.log("sbSet error:",e.message);}
}

async function sbMergeAndSet(table,profile,localCards){
if(!sbReady()){

return;
}
try{

var cloudCards=await sbGet(table,profile);
var merged=localCards.slice(); 
if(cloudCards&&Array.isArray(cloudCards)){

var localIds=new Set(localCards.map(function(c){return c.id;}));
cloudCards.forEach(function(cc){
if(!localIds.has(cc.id)){
merged.push(cc);
}
});
}

var url=_sbUrl+"/rest/v1/"+table;
var payload={id:table+"_"+profile,profile:profile,data:merged,updated_at:new Date().toISOString()};
await fetch(url,{
method:"POST",
headers:{"apikey":_sbKey,"Authorization":"Bearer "+_sbKey,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
body:JSON.stringify(payload)
});

lsSet("cv_"+profile+"_inventory",JSON.stringify(merged));
}catch(e){
console.log("sbMergeAndSet error:",e.message);

await sbSet(table,profile,localCards);
}
}

async function testSupabase(url,key){
var r=await fetch(url+"/rest/v1/cards?limit=1",{headers:{"apikey":key,"Authorization":"Bearer "+key}});
if(!r.ok){var t=await r.text();throw new Error(t);}
return true;
}

function alertOf(card){
if(!card.purchasePrice||!card.lastSalePrice)return"normal";
var pct=((card.lastSalePrice-card.purchasePrice)/card.purchasePrice)*100;
var gain=card.lastSalePrice-card.purchasePrice;
if(gain<25)return"normal";
if(pct>=25)return"urgent_sale";
if(pct>=10)return"time_to_sell";
return"normal";
}

function unrealizedGL(card){
if(!card.purchasePrice)return null;
var mkt=parseFloat(card.estimatedValue||card.lastSalePrice||0);
if(!mkt)return null;
var cost=parseFloat(card.purchasePrice);
return{dollars:mkt-cost,pct:((mkt-cost)/cost)*100};
}

function realizedGL(card){
if(!card.purchasePrice||!card.salePrice)return null;
var profit=parseFloat(card.salePrice)-parseFloat(card.purchasePrice);
return{dollars:profit,pct:(profit/parseFloat(card.purchasePrice))*100};
}

function annualizedROI(card){
if(!card.purchasePrice||!card.salePrice||!card.purchaseDate||!card.saleDate)return null;
var days=(new Date(card.saleDate)-new Date(card.purchaseDate))/(1000*60*60*24);
if(days<1)return null;
var simpleRoi=(parseFloat(card.salePrice)-parseFloat(card.purchasePrice))/parseFloat(card.purchasePrice);
return(Math.pow(1+simpleRoi,365/days)-1)*100;
}

function daysHeld(card){
if(!card.purchaseDate)return null;
var end=card.saleDate?new Date(card.saleDate):new Date();
return Math.round((end-new Date(card.purchaseDate))/(1000*60*60*24));
}

function roiPct(card){
if(!card.purchasePrice||!card.lastSalePrice)return null;
return((card.lastSalePrice-card.purchasePrice)/card.purchasePrice)*100;
}

function holdSignal(card){
var roi=roiPct(card);
if(roi==null)return"unknown";
if(roi>=25)return"sell";
if(roi>=10)return"watch";
if(roi>=0)return"hold";
return"underwater";
}

function sellScore(card){
var roi=roiPct(card)||0;
var bonus=card.alertStatus==="urgent_sale"?50:card.alertStatus==="time_to_sell"?25:0;
return roi+bonus;
}

function compressImage(dataUrl,maxPx,quality){
return new Promise(function(resolve,reject){
var img=new Image();
img.onload=function(){
try{
var w=img.width,h=img.height;
if(w>maxPx||h>maxPx){var s=maxPx/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
var cv=document.createElement("canvas");
cv.width=w;cv.height=h;
var ctx=cv.getContext("2d");
if(!ctx){reject(new Error("No canvas"));return;}
ctx.drawImage(img,0,0,w,h);
var out=cv.toDataURL("image/jpeg",quality);
resolve({b64:out.split(",")[1],mime:"image/jpeg",w:w,h:h});
}catch(e){reject(e);}
};
img.onerror=function(){reject(new Error("Load failed"));};
img.src=dataUrl;
});
}

async function apiCall(key,messages,useSearch){
var body={model:"claude-sonnet-4-6",max_tokens:1500,messages:messages};
if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search"}];
var resp=await fetch("https://api.anthropic.com/v1/messages",{
method:"POST",
headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
body:JSON.stringify(body)
});
var text=await resp.text();
var data;
try{data=JSON.parse(text);}catch(e){throw new Error("Bad API response. Check your key.");}
if(data.error)throw new Error(data.error.message||"API error");
return data;
}

async function identifyCardsFromPhoto(key,b64,mime){
var data=await apiCall(key,[{role:"user",content:[
{type:"image",source:{type:"base64",media_type:mime,data:b64}},
{type:"text",text:"Identify every graded sports card in this photo. Output ONLY a raw JSON array, no markdown. Each object: {playerName,year,brand,set,gradingCompany,grade,isRookie,isAuto,isPatch,isSerialNumbered,printRun,certNumber,bgsCenter,bgsCorners,bgsEdges,bgsSurface,_unclear}. Rules: (1)gradingCompany=PSA/BGS/SGC/CGC only. (2)Read each label independently — never assume cards share grade or cert. (3)PSA cert=numeric on label. BGS cert=barcode area, often starts 00. (4)NEVER fabricate certs — if unreadable set null and add field name to _unclear[]. _unclear=[] if all clear. (5)BGS: read 4 subgrades. (6)RC/Auto/Patch from label only. Return [] if none found."}
]}],false);
var txt=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
var s=txt.indexOf("["),e=txt.lastIndexOf("]");
if(s===-1||e===-1)return[];
try{return JSON.parse(txt.slice(s,e+1));}catch(err){return[];}
}

async function lookupPrice(key,card){
var q=card.year+" "+card.brand+" "+card.set+" "+card.playerName+" "+card.gradingCompany+" "+card.grade;
if(card.isSerialNumbered&&card.printRun)q+=" /"+card.printRun;
var prompt='Search for recent SOLD listings of this graded sports card: "'+q+'". '+
'Search eBay completed listings, Goldin Auctions, PWCC, and Heritage Auctions sold results. '+
'Find the 3-5 most recent actual sold prices — ignore active listings. '+
'Return ONLY a JSON object, no markdown: '+
'{"lastSalePrice":number_or_null,"lastSaleDate":"YYYY-MM-DD_or_null","avgRecentPrice":number_or_null,"salesFound":true_or_false,"source":"where you found it"}. '+
'If no sales found, return {"lastSalePrice":null,"lastSaleDate":null,"avgRecentPrice":null,"salesFound":false,"source":null}.';

}

function matchToInventory(identified,inventory){
return identified.map(function(id){
var match=inventory.find(function(c){
if(c.cardStatus!=="inventory")return false;
var a=(id.playerName||"").toLowerCase(),b=(c.playerName||"").toLowerCase();
return a&&b&&(a.includes(b)||b.includes(a));
})||null;
return Object.assign({},id,{match:match});
});
}

function csvRow(vals){

var url=URL.createObjectURL(blob);
var a=document.createElement("a");
a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}

function exportCSVBuyer(cards){
var now=new Date();
var cutoff=new Date(now.getTime()-90*24*60*60*1000); 
var active=cards.filter(function(c){return c.cardStatus==="inventory";});
var headers=["Player","Year","Brand","Set","Grading Co","Grade","Cert #","RC","Auto","Patch","Serial Numbered","Print Run","BGS Subgrades","Market Value","# Sales (90 Days)","Trend","Condition Notes"];
var rows=active.map(function(c){

var mktVal="";
var saleCount="Insufficient data";
var hasSales=false;
if(c.lastSaleDate&&new Date(c.lastSaleDate)>=cutoff){
mktVal=c.estimatedValue||c.lastSalePrice||"";
hasSales=true;
}
if(c.count30day){saleCount=c.count30day+" (30 days)";}
else if(hasSales){saleCount="1";}

var trend="—";
if(c.lastSalePrice&&c.purchasePrice){
var chg=((c.lastSalePrice-c.purchasePrice)/c.purchasePrice)*100;
trend=chg>5?"↑ Rising":chg<-5?"↓ Declining":"→ Stable";
}

var condNotes="";
if(c.gradingCompany==="BGS"&&c.bgsCenter){
condNotes="BGS Subgrades: Centering "+c.bgsCenter+", Corners "+c.bgsCorners+", Edges "+c.bgsEdges+", Surface "+c.bgsSurface;
}else{
condNotes=c.gradingCompany+" "+c.grade+" — Straight Grade";
}
return csvRow([
c.playerName||"",c.year||"",c.brand||"",c.set||"",
c.gradingCompany||"",c.grade||"",c.certNumber||"",
c.isRookie?"Yes":"No",c.isAuto?"Yes":"No",c.isPatch?"Yes":"No",c.isSerialNumbered?"Yes":"No",c.printRun||"",
(c.gradingCompany==="BGS"&&c.bgsCenter)?c.bgsCenter+"/"+c.bgsCorners+"/"+c.bgsEdges+"/"+c.bgsSurface:"",
mktVal?"$"+parseFloat(mktVal).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"Insufficient data",
saleCount,trend,condNotes
]);
});
downloadCSV([headers.join(",")].concat(rows).join("\n"),"CardVault_Buyer_"+new Date().toISOString().slice(0,10)+".csv");

var allBrands=useMemo(function(){var s=new Set();cards.forEach(function(c){if(c.brand)s.add(c.brand);});return Array.from(s).sort();},[cards]);
var allSports=useMemo(function(){var s=new Set();cards.forEach(function(c){if(c.sport)s.add(c.sport);});return Array.from(s).sort();},[cards]);

function clearFilters(){setFSport("all");setFGradeCo("all");setFGrade("all");setFBrand("all");setFRookie("all");setFAuto("all");setFPatch("all");setFMinPrice("");setFMaxPrice("");setFMinLastSale("");setFMaxLastSale("");setFAlert("all");setFStatus("all");setSearch("");}
var rows=useMemo(function(){
var r=cards.slice();
if(search){var q=search.toLowerCase();r=r.filter(function(x){return(x.playerName||"").toLowerCase().includes(q)||(x.year||"").toString().includes(q)||(x.brand||"").toLowerCase().includes(q)||(x.set||"").toLowerCase().includes(q)||(x.certNumber||"").toLowerCase().includes(q)||(x.sport||"").toLowerCase().includes(q);});}
if(fAlert!=="all")r=r.filter(function(x){return x.alertStatus===fAlert;});
if(fStatus!=="all")r=r.filter(function(x){return x.cardStatus===fStatus;});
if(fSport!=="all")r=r.filter(function(x){return(x.sport||"").toLowerCase()===(fSport||"").toLowerCase();});
if(fGradeCo!=="all")r=r.filter(function(x){return x.gradingCompany===fGradeCo;});
if(fGrade!=="all")r=r.filter(function(x){return x.grade===fGrade;});
if(fBrand!=="all")r=r.filter(function(x){return x.brand===fBrand;});
if(fRookie!=="all")r=r.filter(function(x){return fRookie==="yes"?!!x.isRookie:!x.isRookie;});
if(fAuto!=="all")r=r.filter(function(x){return fAuto==="yes"?!!x.isAuto:!x.isAuto;});
if(fPatch!=="all")r=r.filter(function(x){return fPatch==="yes"?!!x.isPatch:!x.isPatch;});
if(fMinPrice)r=r.filter(function(x){return parseFloat(x.purchasePrice||0)>=parseFloat(fMinPrice);});
if(fMaxPrice)r=r.filter(function(x){return parseFloat(x.purchasePrice||0)<=parseFloat(fMaxPrice);});

if(fMaxLastSale)r=r.filter(function(x){return x.lastSalePrice&&parseFloat(x.lastSalePrice)<=parseFloat(fMaxLastSale);});
r.sort(function(a,b){

else{av=(a[sortField]||"").toLowerCase();bv=(b[sortField]||"").toLowerCase();}
if(av<bv)return sortDir==="asc"?-1:1;
if(av>bv)return sortDir==="asc"?1:-1;
return 0;
});
return r;

function checkDuplicates(newCards,existingCards){
var results=[];
newCards.forEach(function(nc){
var ncCert=String(nc.certNumber||"").trim();
var match=existingCards.find(function(ec){
var ecCert=String(ec.certNumber||"").trim();
if(ncCert&&ecCert){return ncCert===ecCert;}
var nameMatch=String(nc.playerName||"").toLowerCase().trim()===String(ec.playerName||"").toLowerCase().trim();
var gradeMatch=String(nc.grade||"").trim()===String(ec.grade||"").trim();
var gcMatch=String(nc.gradingCompany||"").trim()===String(ec.gradingCompany||"").trim();
var yearMatch=String(nc.year||"").trim()===String(ec.year||"").trim();
var setMatch=!nc.set||!ec.set||String(nc.set||"").toLowerCase().trim()===String(ec.set||"").toLowerCase().trim();
return nameMatch&&gradeMatch&&gcMatch&&yearMatch&&setMatch;
})||null;
results.push({card:nc,existing:match,status:match?match.cardStatus||"inventory":null});
});
return results;
}

<div style={{fontSize:13,fontWeight:700,color:C.amber,marginBottom:6}}>⚠ Previously Sold Card</div>
<div style={{fontSize:12,color:C.text,marginBottom:12,lineHeight:1.6}}>
You previously sold <strong>{dupWarnings[0].existing.playerName}</strong> ({dupWarnings[0].existing.gradingCompany} {dupWarnings[0].existing.grade}) on {dupWarnings[0].existing.saleDate?fmtDate(dupWarnings[0].existing.saleDate):"record"} for {fmtMoney(dupWarnings[0].existing.salePrice)}.<br/>Are you buying this card back?
</div>
<div style={{display:"flex",gap:10}}>
<button style={{...BG,padding:"7px 16px",fontSize:12}} onClick={function(){setDupConfirmed(function(prev){return Object.assign({},prev,{manual:true});});doAddManual();}}>Yes — Add It</button>
<button style={{...BO,padding:"7px 16px",fontSize:12}} onClick={function(){setDupWarnings([]);onClose();}}>No — Cancel</button>
</div>
</div>
)}
</div>
<div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:"16px 20px",borderTop:"1px solid "+C.border}}>
<button style={BO} onClick={onClose}>Cancel</button>
{mode==="buy"&&tab==="photo"&&identified.length>0&&<button style={BG} onClick={doAddAll}>+ Add {identified.length} Card{identified.length!==1?"s":""}</button>}
{mode==="sell"&&matched.length>0&&<button style={BD} onClick={doSellMatched}>💰 Mark {Object.keys(selIds).filter(function(k){return selIds[k];}).length+(Object.keys(addAndSell).length)} Sold</button>}
</div>
</div>
</div>
);
}

function SellModal(p){
var card=p.card,onSell=p.onSell,onClose=p.onClose;
var [sd,setSd]=useState({price:"",date:new Date().toISOString().slice(0,10)});
var profit=sd.price&&card.purchasePrice?parseFloat(sd.price)-parseFloat(card.purchasePrice):null;
return(
<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
<div style={{background:C.card,borderRadius:16,width:"100%",maxWidth:420,overflow:"hidden"}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+C.border}}>
<div style={{fontSize:20,fontWeight:800}}>Mark as Sold</div>
<button onClick={onClose} style={{...BO,padding:"6px 12px"}}>✕</button>
</div>
<div style={{padding:20}}>
<div style={{background:C.surface,borderRadius:10,padding:"14px 16px",marginBottom:18}}><div style={{fontSize:18,fontWeight:800}}>{card.playerName}</div><div style={{fontSize:12,color:C.muted,marginTop:2}}>{card.year} {card.brand} {card.set} · {card.gradingCompany} {card.grade}</div><div style={{fontSize:12,color:C.muted,marginTop:4}}>Cost: {fmtMoney(card.purchasePrice)}</div></div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
<Fld l="Sale Price *"><Inp type="number" step="0.01" placeholder="0.00" value={sd.price} onChange={function(e){setSd(function(pr){return Object.assign({},pr,{price:e.target.value});});}}/></Fld>
<Fld l="Sale Date"><Inp type="date" value={sd.date} onChange={function(e){setSd(function(pr){return Object.assign({},pr,{date:e.target.value});});}}/></Fld>
</div>
{profit!=null&&<div style={{padding:"12px 16px",borderRadius:10,background:profit>=0?"#e8f5ee":"#fdecea"}}><span style={{fontSize:18,fontWeight:800,color:profit>=0?C.green:C.red}}>{profit>=0?"+":""}{fmtMoney(profit)} ({fmtPct(card.purchasePrice?profit/parseFloat(card.purchasePrice)*100:null)})</span></div>}
</div>
<div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:"16px 20px",borderTop:"1px solid "+C.border}}>
<button style={BO} onClick={onClose}>Cancel</button>
<button style={BD} onClick={function(){if(sd.price)onSell(sd);}}>Confirm Sale</button>
</div>
</div>
</div>
);
}

function DetailModal(p){
var card=p.card,readOnly=p.readOnly,onClose=p.onClose,onUpdate=p.onUpdate,onDelete=p.onDelete;
var [editing,setEditing]=useState(false);
var [form,setForm]=useState(Object.assign({},card));
var [manualPrice,setManualPrice]=useState("");
var [manualDate,setManualDate]=useState(new Date().toISOString().slice(0,10));
function upd(k,v){setForm(function(pr){return Object.assign({},pr,{[k]:v});});}
var pnl=card.purchasePrice&&(card.estimatedValue||card.lastSalePrice)?(card.estimatedValue||card.lastSalePrice)-card.purchasePrice:null;
var searchUrl="https://www.130point.com/sales/?query="+encodeURIComponent((card.year||"")+" "+(card.brand||"")+" "+(card.set||"")+" "+(card.playerName||"")+" "+(card.gradingCompany||"")+" "+(card.grade||""));
return(
<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
<div style={{background:C.card,borderRadius:16,width:"100%",maxWidth:520,marginTop:20,overflow:"hidden"}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+C.border}}>
<div style={{fontSize:20,fontWeight:800}}>{card.playerName}</div>
<div style={{display:"flex",gap:8}}>{!readOnly&&!editing&&<button style={{...BO,padding:"6px 12px",fontSize:12}} onClick={function(){setEditing(true);}}>✏ Edit</button>}<button style={{...BO,padding:"6px 12px"}} onClick={onClose}>✕</button></div>
</div>
<div style={{padding:20,maxHeight:"75vh",overflowY:"auto"}}>
{!editing?(
<div>
<div style={{marginBottom:14}}><HoldBadge card={card}/></div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>
{[["Year",card.year],["Brand",card.brand],["Set",card.set],["Grade",card.gradingCompany+" "+card.grade],["Cert #",card.certNumber||"—"],["Status",STATUS_LBL[card.cardStatus]]].map(function(item){var l=item[0],v=item[1];return <div key={l}><div style={LBL}>{l}</div><div style={{fontSize:15,color:C.text,fontWeight:600}}>{v||"—"}</div></div>;})}
</div>
{card.gradingCompany==="BGS"&&card.bgsCenter&&(
<div style={{background:C.surface,borderRadius:10,padding:"12px 16px",marginBottom:14}}>
<div style={{...LBL,marginBottom:8}}>BGS Subgrades</div>
<div style={{display:"flex",gap:20}}>{[["Ctr",card.bgsCenter],["Cor",card.bgsCorners],["Edg",card.bgsEdges],["Srf",card.bgsSurface]].map(function(item){var l=item[0],v=item[1];return(<div key={l} style={{textAlign:"center"}}><div style={{fontSize:9,color:C.muted}}>{l}</div><div style={{fontSize:22,fontWeight:800,color:C.gold}}>{v||"—"}</div></div>);})}</div>
</div>
)}
<div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:14}}>
{card.isRookie&&<span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:4,background:"#dbeafe",color:"#1d4ed8"}}>Rookie Card</span>}
{card.isAuto&&<span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:4,background:"#f3e8ff",color:"#7c3aed"}}>Autograph</span>}
{card.isPatch&&<span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:4,background:"#dcfce7",color:"#15803d"}}>Patch/Relic</span>}
{card.isSerialNumbered&&<span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:4,background:C.goldBg,color:C.gold}}>/{card.printRun} Print Run</span>}
</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
{[["Cost",fmtMoney(card.purchasePrice),""],["Last Sale",fmtMoney(card.lastSalePrice)+(card.lastSaleDate?" · "+fmtDate(card.lastSaleDate):""),""],["P&L",pnl!=null?fmtMoney(pnl):"—",pnl!=null?(pnl>=0?"pos":"neg"):""]].map(function(item){var l=item[0],v=item[1],t=item[2];return(<div key={l} style={{background:t==="pos"?"#e8f5ee":t==="neg"?"#fdecea":C.surface,borderRadius:10,padding:"12px 14px"}}><div style={LBL}>{l}</div><div style={{fontSize:15,fontWeight:800,color:t==="pos"?C.green:t==="neg"?C.red:C.text}}>{v}</div></div>);})}
</div>
{card.notes&&<div style={{fontSize:13,color:C.muted,fontStyle:"italic",padding:"12px 16px",background:C.surface,borderRadius:10,marginBottom:14}}>{card.notes}</div>}
<div style={{background:C.surface,borderRadius:10,padding:"14px 16px",marginBottom:12}}>
<div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:10}}>Manual Last Sale Update</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
<Fld l="Last Sale Price"><Inp type="number" step="0.01" placeholder="e.g. 3500.00" value={manualPrice} onChange={function(e){setManualPrice(e.target.value);}}/></Fld>
<Fld l="Sale Date"><Inp type="date" value={manualDate} onChange={function(e){setManualDate(e.target.value);}}/></Fld>
</div>
<button style={{...BG,padding:"8px 14px",fontSize:12}} onClick={function(){if(!manualPrice)return;var price=parseFloat(manualPrice);var updated=Object.assign({},card,{lastSalePrice:price,lastSaleDate:manualDate||new Date().toISOString().slice(0,10),alertStatus:alertOf(Object.assign({},card,{lastSalePrice:price}))});onUpdate(updated);setManualPrice("");}}>Save Last Sale Price</button>
</div>
<a href={searchUrl} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",background:C.goldBg,border:"1px solid "+C.gold,borderRadius:8,fontSize:12,fontWeight:700,color:C.gold}}>🔍 View on 130point</a>
</div>
):<CardForm card={form} upd={upd}/>}
</div>
{editing&&<div style={{display:"flex",gap:10,justifyContent:"space-between",padding:"16px 20px",borderTop:"1px solid "+C.border}}><button style={{...BD,padding:"6px 12px",fontSize:12}} onClick={function(){if(window.confirm("Delete this card?"))onDelete(card.id);}}>🗑 Delete</button><div style={{display:"flex",gap:10}}><button style={BO} onClick={function(){setEditing(false);setForm(Object.assign({},card));}}>Cancel</button><button style={BG} onClick={function(){onUpdate(form);}}>✓ Save</button></div></div>}
</div>
</div>
);
}

function SettingsModal(p){
var onClose=p.onClose,onResetKey=p.onResetKey;
return(
<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
<div style={{background:C.card,borderRadius:16,width:"100%",maxWidth:400,overflow:"hidden"}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+C.border}}><div style={{fontSize:20,fontWeight:800}}>⚙ Settings</div><button onClick={onClose} style={{...BO,padding:"6px 12px"}}>✕</button></div>
<div style={{padding:20}}>
<div style={{background:C.surface,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
<div style={{fontSize:14,fontWeight:700,marginBottom:4}}>API Keys &amp; Sync</div>
<div style={{fontSize:12,color:C.muted,marginBottom:8}}>Reset to update your Anthropic or Supabase keys on this device.</div>
<div style={{fontSize:11,color:C.muted,marginBottom:10}}>Supabase: <strong style={{color:C.text}}>{(localStorage.getItem("cv_sb_url")||"Not configured").replace("https://","").slice(0,20)+"..."}</strong></div>
<button style={{...BD,padding:"8px 14px",fontSize:12}} onClick={onResetKey}>Reset All Keys</button>
</div>
<div style={{background:C.surface,borderRadius:10,padding:"14px 16px"}}><div style={{fontSize:14,fontWeight:700,marginBottom:4}}>About</div><div style={{fontSize:12,color:C.muted,lineHeight:1.6}}>Dad &amp; Lad's Card Vault<br/>Graded card inventory tracker<br/>Data synced via Supabase</div></div>
</div>
</div>
</div>
);
}

function App(){
var [apiKey,setApiKey]=useState(null);
var [profile,setProfile]=useState(null);
var [view,setView]=useState("dashboard");
var [mode,setMode]=useState("buy");
var [dadCards,setDadCards]=useState([]);
var [owenCards,setOwenCards]=useState([]);
var [dadWatchlist,setDadWatchlist]=useState([]);
var [owenWatchlist,setOwenWatchlist]=useState([]);
var [loading,setLoading]=useState(true);
var [toasts,setToasts]=useState([]);
var [showAdd,setShowAdd]=useState(false);
var [showSell,setShowSell]=useState(null);
var [showDetail,setShowDetail]=useState(null);
var [showSettings,setShowSettings]=useState(false);
var [refreshing,setRefreshing]=useState(false);
var [prog,setProg]=useState({current:0,total:0,card:""});
var [lastRefresh,setLastRefresh]=useState(null);
var [search,setSearch]=useState("");
var [fAlert,setFAlert]=useState("all");
var [fStatus,setFStatus]=useState("all");

useEffect(function(){
async function loadData(){

try{
var k=localStorage.getItem("cv_api_key");if(k)setApiKey(k);
var d=lsGet("cv_dad_inventory");if(d)setDadCards(JSON.parse(d.value));
var o=lsGet("cv_owen_inventory");if(o)setOwenCards(JSON.parse(o.value));
var dwd=lsGet("cv_dad_watchlist");if(dwd)setDadWatchlist(JSON.parse(dwd.value));
var owd=lsGet("cv_owen_watchlist");if(owd)setOwenWatchlist(JSON.parse(owd.value));
var lr=lsGet("cv_last_refresh");if(lr)setLastRefresh(lr.value);
}catch(e){console.log("Local load error:",e.message);}

setLoading(false);

try{
sbInit();
if(sbReady()){
var dd=await sbGet("cards","dad");
var od=await sbGet("cards","owen");
var dw=await sbGet("watchlist","dad");
var ow=await sbGet("watchlist","owen");
if(dd){setDadCards(dd);lsSet("cv_dad_inventory",JSON.stringify(dd));}
if(od){setOwenCards(od);lsSet("cv_owen_inventory",JSON.stringify(od));}
if(dw){setDadWatchlist(dw);lsSet("cv_dad_watchlist",JSON.stringify(dw));}
if(ow){setOwenWatchlist(ow);lsSet("cv_owen_watchlist",JSON.stringify(ow));}
}
}catch(e){console.log("Supabase sync error:",e.message);}
}
loadData();
},[]);

var myCards=profile==="dad"?dadCards:owenCards;
var myWatchlist=profile==="dad"?dadWatchlist:owenWatchlist;
var otherCards=profile==="dad"?owenCards:dadCards;
var otherName=profile==="dad"?"Lad":"Dad";

function setMyWatchlist(wl){if(profile==="dad")setDadWatchlist(wl);else setOwenWatchlist(wl);lsSet("cv_"+profile+"_watchlist",JSON.stringify(wl));sbSet("watchlist",profile,wl);}

function saveCards(pr,cards){
if(pr==="dad")setDadCards(cards);else setOwenCards(cards);
lsSet("cv_"+pr+"_inventory",JSON.stringify(cards));
sbMergeAndSet("cards",pr,cards);
}

function toast(msg,type){var id=uid();setToasts(function(t){return t.concat([{id:id,msg:msg,type:type||"info"}]);});setTimeout(function(){setToasts(function(t){return t.filter(function(x){return x.id!==id;});});},5000);}

function addCards(cards){saveCards(profile,myCards.concat(cards));toast("Added "+cards.length+" card"+(cards.length!==1?"s":"")+"!","success");}
function updateCard(id,updates){saveCards(profile,myCards.map(function(x){return x.id===id?Object.assign({},x,updates):x;}));}
function deleteCard(id){saveCards(profile,myCards.filter(function(x){return x.id!==id;}));setShowDetail(null);toast("Card deleted","info");}
function sellCard(id,sd){saveCards(profile,myCards.map(function(x){return x.id===id?Object.assign({},x,{cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"}):x;}));toast("Card marked as sold","success");}
function sellBulk(ids,sd){saveCards(profile,myCards.map(function(x){return ids.includes(x.id)?Object.assign({},x,{cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"}):x;}));}
function addAndSellCards(newCards,sd){var toSell=newCards.map(function(c){return Object.assign({},c,{cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"});});saveCards(profile,myCards.concat(toSell));toast("Added and sold "+toSell.length+" card"+(toSell.length!==1?"s":""),"success");}

function bulkSavePrices(updates){
var updated=myCards.map(function(x){
if(!updates[x.id])return x;
var u=updates[x.id];
var newCard=Object.assign({},x,{lastSalePrice:u.lastSalePrice,lastSaleDate:u.lastSaleDate});
newCard.alertStatus=alertOf(newCard);return newCard;
});
saveCards(profile,updated);toast("Prices updated","success");
}

async function runRefresh(){
var active=myCards.filter(function(x){return x.cardStatus==="inventory";});
if(!active.length){toast("No active cards","info");return;}
setRefreshing(true);var updated=myCards.slice();var alertCount=0;
for(var i=0;i<active.length;i++){
var card=active[i];setProg({current:i+1,total:active.length,card:card.playerName});
try{
var result=await lookupPrice(apiKey,card);
if(result&&result.salesFound&&result.lastSalePrice){
var existingDate=card.lastSaleDate||"";var newDate=result.lastSaleDate||"";
var isMoreRecent=!existingDate||!newDate||(newDate>=existingDate);
if(isMoreRecent){
var a=alertOf(Object.assign({},card,{lastSalePrice:result.lastSalePrice}));
if(a!=="normal")alertCount++;
updated=updated.map(function(x){return x.id===card.id?Object.assign({},x,{lastSalePrice:result.lastSalePrice,lastSaleDate:result.lastSaleDate,estimatedValue:result.avgRecentPrice||result.lastSalePrice,alertStatus:a,priceSource:result.source||"web search"}):x;});
}
}
}catch(e){console.log("Price check error:",e.message);}
if(i<active.length-1)await new Promise(function(r){setTimeout(r,600);});
}
if(profile==="dad")setDadCards(updated.slice());else setOwenCards(updated.slice());
lsSet("cv_"+profile+"_inventory",JSON.stringify(updated));
sbSet("cards",profile,updated);
var now=new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
lsSet("cv_last_refresh",now);setLastRefresh(now);
setRefreshing(false);setProg({current:0,total:0,card:""});
toast("Done · "+alertCount+" alert"+(alertCount!==1?"s":""),alertCount>0?"info":"success");
}

if(loading)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",fontSize:18,color:C.gold,fontWeight:700}}>Loading…</div>;
if(!apiKey)return <SetupScreen onSave={function(k){localStorage.setItem("cv_api_key",k);setApiKey(k);}}/>;
if(!profile)return <ProfileScreen counts={{dad:{inventory:dadCards.filter(function(c){return c.cardStatus==="inventory";}).length,sold:dadCards.filter(function(c){return c.cardStatus==="sold";}).length},owen:{inventory:owenCards.filter(function(c){return c.cardStatus==="inventory";}).length,sold:owenCards.filter(function(c){return c.cardStatus==="sold";}).length}}} onSelect={function(pr){setProfile(pr);setView("dashboard");}} onSettings={function(){setShowSettings(true);}}/>;

return(
<div style={{minHeight:"100vh",background:C.bg}}>
<Nav profile={profile} mode={mode} view={view} onMode={setMode} onView={function(v){setView(v);setSearch("");setFAlert("all");setFStatus("all");}} onSwitch={function(){setProfile(null);}}/>
{view==="dashboard"&&<Dashboard cards={myCards} mode={mode} onRefresh={runRefresh} onAdd={function(){setShowAdd(true);}} refreshing={refreshing} prog={prog} lastRefresh={lastRefresh} onExport={function(type){if(type==="buyer"){exportCSVBuyer(myCards);toast("Buyer report downloaded!","success");}else{exportCSVInternal(myCards);toast("Internal report downloaded!","success");}}}/>}
{(view==="inventory"||view==="browse")&&<InventoryView cards={view==="browse"?otherCards:myCards} onAdd={function(){setShowAdd(true);}} onSell={function(x){setShowSell(x);}} onView={function(x){setShowDetail(x);}} mode={mode} readOnly={view==="browse"} ownerName={otherName} search={search} setSearch={setSearch} fAlert={fAlert} setFAlert={setFAlert} fStatus={fStatus} setFStatus={setFStatus} onBulkSave={bulkSavePrices}/>}
{view==="sell_rank"&&<SellRankView cards={myCards} onView={function(x){setShowDetail(x);}}/>}
{view==="watchlist"&&<WatchlistView apiKey={apiKey} watchlist={myWatchlist} setWatchlist={setMyWatchlist} toast={toast}/>}
{showAdd&&<AddModal apiKey={apiKey} mode={mode} myCards={myCards} onAdd={addCards} onSellBulk={sellBulk} onAddAndSell={addAndSellCards} onClose={function(){setShowAdd(false);}} toast={toast}/>}
{showSell&&<SellModal card={showSell} onSell={function(sd){sellCard(showSell.id,sd);setShowSell(null);}} onClose={function(){setShowSell(null);}}/>}
{showDetail&&<DetailModal card={showDetail} readOnly={view==="browse"} onClose={function(){setShowDetail(null);}} onUpdate={function(u){updateCard(showDetail.id,u);setShowDetail(null);toast("Saved","success");}} onDelete={deleteCard}/>}
{showSettings&&<SettingsModal onClose={function(){setShowSettings(false);}} onResetKey={function(){localStorage.removeItem("cv_api_key");localStorage.removeItem("cv_sb_url");localStorage.removeItem("cv_sb_key");setApiKey(null);setShowSettings(false);}}/>}
<div style={{position:"fixed",bottom:20,right:20,display:"flex",flexDirection:"column",gap:8,zIndex:200,maxWidth:300}}>
{toasts.map(function(t){return <div key={t.id} style={{background:C.card,borderLeft:"4px solid "+(t.type==="success"?C.green:t.type==="error"?C.red:C.gold),borderRadius:10,padding:"12px 16px",fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.15)"}}>{t.msg}</div>;})}
</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
</html>
