  del:(k)=>{try{localStorage.removeItem(k);return true;}catch{return false;}}
};

/* ── Alert logic ── */
function alertOf(card){
  if(!card.purchasePrice||!card.lastSalePrice)return"normal";
  const pct=((card.lastSalePrice-card.purchasePrice)/card.purchasePrice)*100;
  const gain=card.lastSalePrice-card.purchasePrice;
  if(gain<25)return"normal";
  if(pct>=25)return"urgent_sale";
  if(pct>=10)return"time_to_sell";
  return"normal";
}

/* ── Image compression ── */
function compressImage(dataUrl,maxPx,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){const s=maxPx/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const cv=document.createElement("canvas");
        cv.width=w;cv.height=h;
        const ctx=cv.getContext("2d");
        if(!ctx){reject(new Error("Canvas unavailable"));return;}
        ctx.drawImage(img,0,0,w,h);
        const out=cv.toDataURL("image/jpeg",quality);
        if(!out||out==="data:,"){reject(new Error("Compression failed"));return;}
        resolve({b64:out.split(",")[1],mime:"image/jpeg",w,h});
      }catch(e){reject(e);}
    };
    img.onerror=()=>reject(new Error("Image load failed"));
    img.src=dataUrl;
  });
}

/* ── API calls (direct to Anthropic with user's key) ── */
async function aiCall(apiKey,messages,useSearch=false){
  const body={model:"claude-sonnet-4-20250514",max_tokens:1500,messages};
  if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify(body)
  });
  const rawText=await r.text();
  let d;
  try{d=JSON.parse(rawText);}
  catch(e){throw new Error("Unexpected response from API. Check your API key.");}
  if(d.error)throw new Error(d.error.message||"API Error");
  return d;
}

async function identifyCards(apiKey,b64,mime){
  const d=await aiCall(apiKey,[{role:"user",content:[
    {type:"image",source:{type:"base64",media_type:mime,data:b64}},
    {type:"text",text:"List every graded sports card visible in this photo as a JSON array. Output ONLY the raw JSON array, no explanation, no markdown. Each item: {playerName,year,brand,set,gradingCompany(PSA|BGS|SGC|CGC),grade,isRookie(bool),isAuto(bool),isPatch(bool),isSerialNumbered(bool),printRun(number|null),certNumber(string|null),bgsCenter(string|null),bgsCorners(string|null),bgsEdges(string|null),bgsSurface(string|null)}. Return [] if no graded cards visible."}
  ]}]);
  const txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  if(!txt)return[];
  const s=txt.indexOf("["),e=txt.lastIndexOf("]");
  if(s===-1||e===-1)return[];
  try{return JSON.parse(txt.slice(s,e+1));}
  catch{return[];}
}

async function priceCheck(apiKey,card){
  const q=`${card.year} ${card.brand} ${card.set} ${card.playerName} ${card.gradingCompany} ${card.grade}${card.isSerialNumbered&&card.printRun?` /${card.printRun}`:""}`;
  const d=await aiCall(apiKey,[{role:"user",content:`Search 130point.com for recent sold listings: "${q}". Return ONLY JSON (no markdown): {"lastSalePrice":number|null,"lastSaleDate":"YYYY-MM-DD"|null,"avgRecentPrice":number|null,"salesFound":boolean}`}],true);
  const txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  if(!txt)return null;
  const s=txt.indexOf("{"),e=txt.lastIndexOf("}");
  if(s===-1||e===-1)return null;
  try{return JSON.parse(txt.slice(s,e+1));}catch{return null;}
}

function matchToInventory(identified,inventory){
  return identified.map(id=>{
    const match=inventory.find(c=>{
      if(c.cardStatus!=="inventory")return false;
      const a=(id.playerName||"").toLowerCase();
      const b=(c.playerName||"").toLowerCase();
      return a&&b&&(a.includes(b)||b.includes(a));
    })||null;
    return{...id,match};
  });
}

/* ════════════════════════════════════
   SETUP SCREEN (API Key entry)
════════════════════════════════════ */
function SetupScreen({onSave}){
  const [key,setKey]=useState("");
  const [err,setErr]=useState("");
  const [testing,setTesting]=useState(false);

  const handleSave=async()=>{
    if(!key.trim()){setErr("Please paste your API key");return;}
    if(!key.trim().startsWith("sk-ant-")){setErr("That doesn't look like an Anthropic API key. It should start with sk-ant-");return;}
    setTesting(true);setErr("");
    try{
      await aiCall(key.trim(),[{role:"user",content:"Say OK"}]);
      onSave(key.trim());
    }catch(e){
      setErr("Couldn't connect: "+e.message+". Double-check your key and try again.");
    }
    setTesting(false);
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,background:col.bg}}>
      <div style={{width:"100%",maxWidth:480}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:6,textTransform:"uppercase",color:col.gold,marginBottom:8}}>Dad &amp; Lad's</div>
          <div style={{fontSize:36,fontWeight:800,letterSpacing:2,color:col.text,lineHeight:1.1}}>CARD VAULT</div>
          <div style={{fontSize:13,color:col.muted,marginTop:8}}>One-time setup — takes 2 minutes</div>
        </div>

        <div style={{background:col.card,borderRadius:14,padding:24,border:"1px solid "+col.border}}>
          <div style={{fontSize:15,fontWeight:700,color:col.text,marginBottom:6}}>Enter your Anthropic API Key</div>
          <div style={{fontSize:13,color:col.muted,marginBottom:20,lineHeight:1.6}}>
            This is what powers the AI that reads your card photos. You only enter this once.<br/><br/>
            <strong style={{color:col.text}}>To find your key:</strong><br/>
            1. Go to <strong>console.anthropic.com</strong><br/>
            2. Click <strong>API Keys</strong> in the left menu<br/>
            3. Click <strong>Create Key</strong>, give it any name<br/>
            4. Copy the key (starts with <code style={{background:col.surface,padding:"1px 5px",borderRadius:3,fontSize:12}}>sk-ant-</code>) and paste below
          </div>
          <Fld l="API Key">
            <Inp
              type="password"
              value={key}
              onChange={e=>setKey(e.target.value)}
              placeholder="sk-ant-api03-..."
            />
          </Fld>
          {err&&<div style={{marginTop:10,padding:"8px 12px",background:"#fdecea",borderRadius:6,fontSize:12,color:col.red}}>{err}</div>}
          <button style={{...btnG,width:"100%",justifyContent:"center",marginTop:16}} onClick={handleSave} disabled={testing}>
            {testing?"Testing connection…":"Save & Get Started →"}
          </button>
        </div>

        <div style={{textAlign:"center",fontSize:11,color:col.muted,marginTop:16,lineHeight:1.6}}>
          Your key is stored only on this device — never shared anywhere.<br/>
          Typical cost: scanning 100 card photos ≈ $0.10
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════
   DASHBOARD
════════════════════════════════════ */
function Dashboard({cards,onRefresh,onAdd,refreshing,prog,lastRefresh}){
  const active=cards.filter(x=>x.cardStatus==="inventory");
  const cost=active.reduce((s,x)=>s+(parseFloat(x.purchasePrice)||0),0);
  const val=active.reduce((s,x)=>s+(x.estimatedValue||parseFloat(x.purchasePrice)||0),0);
  const pnl=val-cost;
  const pnlPct=cost>0?pnl/cost*100:null;
  const alerts=active.filter(x=>x.alertStatus!=="normal");
  const urgent=active.filter(x=>x.alertStatus==="urgent_sale");

  return(
    <div style={{padding:16,maxWidth:800,margin:"0 auto"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
        {[["Cards",active.length,col.gold],["Cost Basis",f$(cost),col.text],["Est. Value",f$(val),col.text],["Gain / Loss",`${f$(pnl)} ${fpct(pnlPct)}`,pnl>=0?col.green:col.red],["Alerts",alerts.length,alerts.length>0?col.red:col.text],["Urgent",urgent.length,urgent.length>0?col.red:col.text]].map(([l,v,c])=>(
          <div key={l} style={{background:col.card,borderRadius:10,padding:"12px 14px",border:"1px solid "+col.border}}>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:col.muted,marginBottom:6}}>{l}</div>
            <div style={{fontSize:20,fontWeight:800,color:c,lineHeight:1}}>{v}</div>
          </div>
        ))}
      </div>

      <div style={{background:col.card,borderRadius:12,padding:"16px 18px",marginBottom:16,border:"1px solid "+col.border}}>
        <div style={{fontSize:15,fontWeight:800,color:col.text,marginBottom:4}}>🔄 Morning Price Refresh</div>
        <div style={{fontSize:12,color:col.muted,marginBottom:12}}>
          {refreshing?`Checking ${prog.card}… (${prog.current}/${prog.total})`:lastRefresh?`Last run: ${lastRefresh}`:`Checks 130point for all ${active.length} active cards`}
        </div>
        {refreshing&&<div style={{height:4,background:col.border,borderRadius:2,marginBottom:12,overflow:"hidden"}}><div style={{height:"100%",background:col.gold,width:(prog.total?prog.current/prog.total*100:0)+"%",transition:"width .3s"}}></div></div>}
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <button style={btnO} onClick={onAdd}>+ Add Card</button>
          <button style={{...btnG,opacity:refreshing||!active.length?.4:1}} onClick={onRefresh} disabled={refreshing||!active.length}>
            {refreshing?"Running…":"Run Refresh"}
          </button>
        </div>
      </div>

      {alerts.length>0&&(
        <div>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:col.muted,marginBottom:12}}>Active Alerts</div>
          {alerts.map(x=>{
            const pct=x.purchasePrice&&x.lastSalePrice?(x.lastSalePrice-x.purchasePrice)/x.purchasePrice*100:null;
            const urg=x.alertStatus==="urgent_sale";
            return(
              <div key={x.id} style={{background:col.card,border:"1px solid "+(urg?col.red:col.amber),borderRadius:10,padding:"14px 16px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:3,background:urg?col.red:col.amber,color:"#fff",display:"inline-block",marginBottom:6,letterSpacing:1}}>{urg?"URGENT SALE":"TIME TO SELL"}</div>
                  <div style={{fontSize:16,fontWeight:800,color:col.text}}>{x.playerName}</div>
                  <div style={{fontSize:11,color:col.muted,marginTop:2}}>{x.year} {x.brand} {x.set} · {x.gradingCompany} {x.grade}</div>
                  <div style={{fontSize:11,color:col.muted,marginTop:4}}>Cost {f$(x.purchasePrice)} → Last sale {f$(x.lastSalePrice)}</div>
                </div>
                <div style={{fontSize:26,fontWeight:800,color:urg?col.red:col.amber,marginLeft:16}}>{fpct(pct)}</div>
              </div>
            );
          })}
        </div>
      )}
      {alerts.length===0&&active.length>0&&(
        <div style={{textAlign:"center",padding:48,color:col.muted}}>
          <div style={{fontSize:32,marginBottom:12}}>📊</div>
          <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>No alerts right now</div>
          <div style={{fontSize:13}}>Run a refresh to check for price movements</div>
        </div>
      )}
      {active.length===0&&(
        <div style={{textAlign:"center",padding:48,color:col.muted}}>
          <div style={{fontSize:32,marginBottom:12}}>🃏</div>
          <div style={{fontWeight:700,fontSize:16,marginBottom:16}}>No cards yet</div>
          <button style={btnG} onClick={onAdd}>+ Add Your First Card</button>
        </div>
      )}
    </div>
  );
}

function InventoryView({cards,onAdd,onSell,onView,mode,readOnly,ownerName,search,setSearch,fAlert,setFAlert,fStatus,setFStatus}){
  const rows=useMemo(()=>{
    let r=[...cards];

    if(fAlert!=="all")r=r.filter(x=>x.alertStatus===fAlert);
    if(fStatus!=="all")r=r.filter(x=>x.cardStatus===fStatus);
    return r.sort((a,b)=>(a.playerName||"").localeCompare(b.playerName||""));
  },[cards,search,fAlert,fStatus]);

  return(
    <div style={{padding:16,maxWidth:800,margin:"0 auto"}}>
      {readOnly&&(
        <div style={{background:"#fff8ee",border:"1px solid "+col.amber,borderRadius:8,padding:"10px 14px",fontSize:12,color:col.amber,marginBottom:14,textAlign:"center",fontWeight:600}}>
          👁 Viewing {ownerName}'s collection — read only

          <select style={{...inp,flex:1}} value={fAlert} onChange={e=>setFAlert(e.target.value)}>

            <option value="normal">Normal</option>
            <option value="time_to_sell">Time to Sell</option>
            <option value="urgent_sale">Urgent Sale</option>
          </select>
          <select style={{...inp,flex:1}} value={fStatus} onChange={e=>setFStatus(e.target.value)}>
            <option value="all">All status</option>
            <option value="inventory">In Inventory</option>
            <option value="sold">Sold</option>
            <option value="consigned">Consigned</option>
            <option value="grading">Grading</option>
          </select>
        </div>
        {!readOnly&&<button style={btnG} onClick={onAdd}>+ Add Card</button>}
      </div>

      {rows.length===0?(
        <div style={{textAlign:"center",padding:48,color:col.muted}}>
          <div style={{fontSize:32,marginBottom:12}}>🔍</div>
          <div style={{fontWeight:700,fontSize:16,marginBottom:12}}>{cards.length===0?"No cards yet":"No results"}</div>
          {cards.length===0&&!readOnly&&<button style={btnG} onClick={onAdd}>+ Add your first card</button>}
        </div>
      ):rows.map(x=>{
        const pnl=x.purchasePrice&&(x.estimatedValue||x.lastSalePrice)?(x.estimatedValue||x.lastSalePrice)-x.purchasePrice:null;
        const pnlPct=x.purchasePrice&&pnl!=null?pnl/x.purchasePrice*100:null;
        const alertColor=x.alertStatus==="urgent_sale"?col.red:x.alertStatus==="time_to_sell"?col.amber:null;
        return(
          <div key={x.id} style={{background:col.card,border:"1px solid "+(alertColor||col.border),borderRadius:12,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div style={{flex:1}}>
                <div style={{fontSize:18,fontWeight:800,color:col.text}}>{x.playerName||"—"}</div>
                <div style={{fontSize:12,color:col.muted,marginTop:2}}>{x.year} {x.brand} · {x.set}</div>
                {x.certNumber&&<div style={{fontSize:11,color:col.muted,opacity:.7,marginTop:1}}>Cert #{x.certNumber}</div>}
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                <div style={{display:"flex",alignItems:"center",gap:4,background:col.surface,border:"1px solid "+col.border,borderRadius:5,padding:"3px 10px"}}>
                  <span style={{fontSize:10,fontWeight:700,color:col.muted,letterSpacing:1}}>{x.gradingCompany}</span>
                  <span style={{fontSize:20,fontWeight:800,color:col.gold}}>{x.grade}</span>
                </div>
                {alertColor&&<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:3,background:alertColor,color:"#fff",letterSpacing:.5}}>{x.alertStatus==="urgent_sale"?"URGENT":"SELL"}</span>}
              </div>
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10}}>
              {x.isRookie&&<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:3,background:"#dbeafe",color:"#1d4ed8"}}>RC</span>}
              {x.isAuto&&<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:3,background:"#f3e8ff",color:"#7c3aed"}}>AUTO</span>}
              {x.isPatch&&<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:3,background:"#dcfce7",color:"#15803d"}}>PATCH</span>}
              {x.isSerialNumbered&&<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:3,background:col.goldBg,color:col.gold}}>/{x.printRun}</span>}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <div style={{fontSize:12,color:col.muted}}>
                Cost <strong style={{color:col.text}}>{f$(x.purchasePrice)}</strong>
                {x.lastSalePrice&&<> · Last <strong style={{color:col.text}}>{f$(x.lastSalePrice)}</strong></>}
                {pnl!=null&&<> · <strong style={{color:pnl>=0?col.green:col.red}}>{f$(pnl)} ({fpct(pnlPct)})</strong></>}
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>onView(x)} style={{...btnO,padding:"6px 12px",fontSize:12}}>View</button>
                {!readOnly&&x.cardStatus==="inventory"&&mode==="sell"&&<button onClick={()=>onSell(x)} style={{...btnD,padding:"6px 12px",fontSize:12}}>Sell</button>}
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:5,marginTop:8}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:x.cardStatus==="inventory"?"#22c55e":x.cardStatus==="sold"?col.muted:x.cardStatus==="consigned"?"#60a5fa":col.amber}}></div>
              <span style={{fontSize:11,color:col.muted}}>{STATUS_LBL[x.cardStatus||"inventory"]}{x.cardStatus==="sold"&&x.salePrice?` · Sold ${f$(x.salePrice)}`:""}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ════════════════════════════════════
   CARD FORM (reusable)
════════════════════════════════════ */
function CardForm({card,upd}){
  const G={display:"grid",gridTemplateColumns:"1fr 1fr",gap:12};
  const SH=({t})=><div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:col.muted,marginBottom:10}}>{t}</div>;
  return(
    <div>
      <SH t="Card Identity"/>
      <div style={G}>
        <Fld l="Player Name *"><Inp value={card.playerName} onChange={e=>upd("playerName",e.target.value)} placeholder="e.g. Patrick Mahomes"/></Fld>
        <Fld l="Year"><Inp value={card.year} onChange={e=>upd("year",e.target.value)} placeholder="e.g. 2019"/></Fld>
        <Fld l="Brand"><Sel value={card.brand} onChange={e=>upd("brand",e.target.value)}><option value="">Select…</option>{BRANDS.map(b=><option key={b}>{b}</option>)}</Sel></Fld>
        <Fld l="Set"><Inp value={card.set} onChange={e=>upd("set",e.target.value)} placeholder="e.g. Prizm, Chrome"/></Fld>
      </div>
      <HR/>
      <SH t="Attributes"/>
      <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:12}}>
        {[["isRookie","Rookie Card"],["isAuto","Auto"],["isPatch","Patch / Relic"],["isSerialNumbered","Serial Numbered"]].map(([k,l])=>(
          <label key={k} style={{display:"flex",alignItems:"center",gap:7,fontSize:13,color:col.text,cursor:"pointer"}}>
            <input type="checkbox" checked={!!card[k]} onChange={e=>upd(k,e.target.checked)} style={{accentColor:col.gold,width:15,height:15}}/>{l}
          </label>
        ))}
      </div>
      {card.isSerialNumbered&&<div style={{marginBottom:12}}><Fld l="Print Run"><Inp type="number" value={card.printRun} onChange={e=>upd("printRun",e.target.value)} placeholder="e.g. 25" style={{maxWidth:130}}/></Fld></div>}
      <HR/>
      <SH t="Grading"/>
      <div style={G}>
        <Fld l="Company *"><Sel value={card.gradingCompany} onChange={e=>upd("gradingCompany",e.target.value)}>{GCS.map(g=><option key={g}>{g}</option>)}</Sel></Fld>
        <Fld l="Grade *"><Inp value={card.grade} onChange={e=>upd("grade",e.target.value)} placeholder="e.g. 10, 9.5"/></Fld>
        <Fld l="Cert Number" s2><Inp value={card.certNumber} onChange={e=>upd("certNumber",e.target.value)} placeholder="Grading cert #"/></Fld>
      </div>
      {card.gradingCompany==="BGS"&&(
        <div style={{...G,marginTop:12}}>
          {[["bgsCenter","Centering"],["bgsCorners","Corners"],["bgsEdges","Edges"],["bgsSurface","Surface"]].map(([k,l])=>(
            <Fld key={k} l={"BGS "+l}><Inp value={card[k]} onChange={e=>upd(k,e.target.value)} placeholder="e.g. 9.5"/></Fld>
          ))}
        </div>
      )}
      <HR/>
      <SH t="Financial"/>
      <div style={G}>
        <Fld l="Purchase Price"><Inp type="number" step="0.01" value={card.purchasePrice} onChange={e=>upd("purchasePrice",e.target.value)} placeholder="0.00"/></Fld>
        <Fld l="Purchase Date"><Inp type="date" value={card.purchaseDate} onChange={e=>upd("purchaseDate",e.target.value)}/></Fld>
        <Fld l="Where Purchased" s2><Sel value={card.wherePurchased} onChange={e=>upd("wherePurchased",e.target.value)}><option value="">Select…</option>{WHERE.map(w=><option key={w}>{w}</option>)}</Sel></Fld>
      </div>
      <HR/>
      <Fld l="Notes"><textarea style={{...inp,minHeight:60,resize:"vertical"}} value={card.notes} onChange={e=>upd("notes",e.target.value)} placeholder="Any notes…"/></Fld>
    </div>
  );
}

/* ════════════════════════════════════
   ADD CARD MODAL
════════════════════════════════════ */
function AddModal({apiKey,mode,myCards,onAdd,onSellBulk,onClose,toast}){
  const [tab,setTab]=useState("photo");
  const [img,setImg]=useState(null);
  const [b64,setB64]=useState(null);
  const [mime,setMime]=useState(null);
  const [imgInfo,setImgInfo]=useState("");
  const [busy,setBusy]=useState(false);
  const [statusMsg,setStatusMsg]=useState("");
  const [identified,setIdentified]=useState([]);
  const [matched,setMatched]=useState([]);
  const [form,setForm]=useState({...BLANK});
  const [saleInfo,setSaleInfo]=useState({price:"",date:new Date().toISOString().slice(0,10)});
  const [selIds,setSelIds]=useState({});
  const fileRef=useRef();
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  const handleFile=f=>{
    if(!f)return;
    setStatusMsg("Compressing image…");
    const r=new FileReader();
    r.onload=async e=>{
      const raw=e.target.result;
      setImg(raw);
      try{
        let c1=await compressImage(raw,900,0.78);
        let finalB64=c1.b64,finalW=c1.w,finalH=c1.h;
        let sz=Math.round(c1.b64.length*0.75/1024);
        if(sz>350){
          const c2=await compressImage(raw,600,0.65);
          finalB64=c2.b64;finalW=c2.w;finalH=c2.h;
          sz=Math.round(c2.b64.length*0.75/1024);
        }
        setB64(finalB64);setMime("image/jpeg");
        setImgInfo(`${finalW}×${finalH}px · ~${sz}KB`);
        setStatusMsg("Ready — tap Identify Cards");
      }catch{
        const orig=raw.split(",")[1];
        setB64(orig);setMime(f.type||"image/jpeg");
        setImgInfo("Original size");
        setStatusMsg("Ready — tap Identify Cards");
      }
    };
    r.readAsDataURL(f);
  };

  const doIdentify=async()=>{
    if(!b64){toast("No image loaded","error");return;}
    setBusy(true);setStatusMsg("Reading card labels…");
    try{
      const cards=await identifyCards(apiKey,b64,mime);
      if(!cards.length){setStatusMsg("No graded cards found — try a clearer photo");setBusy(false);return;}
      setStatusMsg(`Found ${cards.length} card${cards.length!=="1"?"s":""}!`);
      if(mode==="sell"){
        const m=matchToInventory(cards,myCards);
        setMatched(m);
        const s={};m.forEach(x=>{if(x.match)s[x.match.id]=true;});
        setSelIds(s);
      }else{
        setIdentified(cards);
      }
    }catch(e){
      const msg="Error: "+e.message;
      toast(msg,"error");setStatusMsg(msg);
    }
    setBusy(false);
  };

  const doAddAll=async()=>{
    const toAdd=identified.map(x=>({...BLANK,...x,id:uid(),addedDate:new Date().toISOString().slice(0,10),cardStatus:"inventory",alertStatus:"normal",lastSalePrice:null,lastSaleDate:null,estimatedValue:null,purchasePrice:form.purchasePrice,purchaseDate:form.purchaseDate,wherePurchased:form.wherePurchased}));
    await onAdd(toAdd);onClose();
  };

  const doSellMatched=async()=>{
    const ids=Object.keys(selIds).filter(k=>selIds[k]);
    if(!ids.length){toast("Select at least one card","error");return;}
    if(!saleInfo.price){toast("Enter a sale price","error");return;}
    await onSellBulk(ids,saleInfo);onClose();
  };

  const doAddManual=async()=>{
    if(!form.playerName||!form.grade){toast("Player name and grade are required","error");return;}
    await onAdd([{...form,id:uid(),addedDate:new Date().toISOString().slice(0,10),cardStatus:"inventory",alertStatus:"normal",lastSalePrice:null,lastSaleDate:null,estimatedValue:null}]);
    onClose();
  };

  const Overlay=({children})=>(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      {children}
    </div>
  );

  return(
    <Overlay>
      <div style={{background:col.card,borderRadius:16,width:"100%",maxWidth:560,marginTop:20,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+col.border}}>
          <div style={{fontSize:20,fontWeight:800,color:col.text}}>{mode==="sell"?"Sell Cards":"Add Cards"}</div>
          <button onClick={onClose} style={{...btnO,padding:"6px 12px",fontSize:13}}>✕</button>
        </div>
        <div style={{padding:20,maxHeight:"75vh",overflowY:"auto"}}>
          {mode==="buy"&&(
            <div style={{display:"flex",borderBottom:"1px solid "+col.border,marginBottom:18}}>
              {[["photo","📷 Photo"],["manual","📝 Manual"]].map(([t,l])=>(
                <button key={t} onClick={()=>setTab(t)}
                  style={{padding:"10px 18px",fontSize:12,fontWeight:700,cursor:"pointer",border:"none",background:"transparent",color:tab===t?col.gold:col.muted,borderBottom:tab===t?"2px solid "+col.gold:"2px solid transparent",letterSpacing:.5}}>
                  {l}
                </button>
              ))}
            </div>
          )}

          {(tab==="photo"||mode==="sell")&&(
            <div>
              {!img?(
                <div onClick={()=>fileRef.current.click()}
                  style={{border:"2px dashed "+col.border,borderRadius:12,padding:36,textAlign:"center",cursor:"pointer",transition:"border-color .15s"}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=col.gold}
                  onMouseLeave={e=>e.currentTarget.style.borderColor=col.border}>
                  <div style={{fontSize:44,marginBottom:12}}>📷</div>
                  <div style={{fontSize:15,color:col.muted,fontWeight:700}}>Tap to upload photo</div>
                  <div style={{fontSize:12,color:col.muted,marginTop:5}}>{mode==="sell"?"Cards you're selling":"Take a photo of your cards — one or many"}</div>
                  <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
                </div>
              ):(
                <div>
                  <img src={img} style={{width:"100%",maxHeight:240,objectFit:"contain",borderRadius:10,border:"1px solid "+col.border,marginBottom:10}} alt="Cards"/>
                  {imgInfo&&<div style={{fontSize:11,color:col.muted,textAlign:"center",marginBottom:8}}>{imgInfo}</div>}
                  {statusMsg&&<div style={{fontSize:12,fontWeight:700,textAlign:"center",marginBottom:12,padding:"6px 12px",borderRadius:6,background:statusMsg.startsWith("Error")?col.red+"22":col.gold+"22",color:statusMsg.startsWith("Error")?col.red:col.gold}}>{statusMsg}</div>}
                  <div style={{display:"flex",gap:10,marginBottom:16}}>
                    <button style={btnO} onClick={()=>{setImg(null);setB64(null);setIdentified([]);setMatched([]);setStatusMsg("");setImgInfo("");}}>🗑 Clear</button>
                    <button style={{...btnG,opacity:busy?.5:1,flex:1,justifyContent:"center"}} onClick={doIdentify} disabled={busy}>{busy?"Reading labels…":"Identify Cards"}</button>
                  </div>

                  {mode==="buy"&&identified.length>0&&(
                    <div>
                      <div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:col.muted,marginBottom:10}}>Identified {identified.length} card{identified.length!==1?"s":""}</div>
                      {identified.map((x,i)=>(
                        <div key={i} style={{background:col.surface,borderRadius:8,padding:"10px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                          <div>
                            <div style={{fontSize:15,fontWeight:800,color:col.text}}>{x.playerName}</div>
                            <div style={{fontSize:11,color:col.muted}}>{x.year} {x.brand} {x.set} · {x.gradingCompany} {x.grade}{x.isRookie?" · RC":""}{x.isAuto?" · AUTO":""}{x.isPatch?" · PATCH":""}</div>
                          </div>
                          <span style={{color:col.green,fontSize:18,fontWeight:700}}>✓</span>
                        </div>
                      ))}
                      <div style={{background:col.surface,borderRadius:10,padding:"14px 16px",marginTop:4}}>
                        <div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:col.muted,marginBottom:12}}>Purchase Info (applies to all)</div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                          <Fld l="Price each"><Inp type="number" step="0.01" placeholder="0.00" value={form.purchasePrice} onChange={e=>setForm(p=>({...p,purchasePrice:e.target.value}))}/></Fld>
                          <Fld l="Date"><Inp type="date" value={form.purchaseDate} onChange={e=>setForm(p=>({...p,purchaseDate:e.target.value}))}/></Fld>
                          <Fld l="Where" s2><Sel value={form.wherePurchased} onChange={e=>setForm(p=>({...p,wherePurchased:e.target.value}))}><option value="">Select…</option>{WHERE.map(w=><option key={w}>{w}</option>)}</Sel></Fld>
                        </div>
                      </div>
                    </div>
                  )}

                  {mode==="sell"&&matched.length>0&&(
                    <div>
                      <div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:col.muted,marginBottom:10}}>Matched to inventory</div>
                      {matched.map((m,i)=>(
                        <div key={i} style={{background:col.surface,border:"1px solid "+(m.match?col.green:col.red),borderRadius:8,padding:"10px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:12,opacity:m.match?1:.6}}>
                          {m.match&&<input type="checkbox" checked={!!selIds[m.match.id]} onChange={e=>setSelIds(p=>({...p,[m.match.id]:e.target.checked}))} style={{width:17,height:17,accentColor:col.gold}}/>}
                          <div style={{flex:1}}>
                            <div style={{fontSize:15,fontWeight:800,color:col.text}}>{m.playerName}</div>
                            <div style={{fontSize:11,color:col.muted}}>{m.year} {m.brand} {m.set} · {m.gradingCompany} {m.grade}</div>
                            <div style={{fontSize:11,marginTop:3,color:m.match?col.green:col.red}}>{m.match?`✓ Found · Cost ${f$(m.match.purchasePrice)}`:"Not found in inventory"}</div>
                          </div>
                        </div>
                      ))}
                      <div style={{background:col.surface,borderRadius:10,padding:"14px 16px",marginTop:10}}>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                          <Fld l="Sale Price (total)"><Inp type="number" step="0.01" placeholder="0.00" value={saleInfo.price} onChange={e=>setSaleInfo(p=>({...p,price:e.target.value}))}/></Fld>
                          <Fld l="Sale Date"><Inp type="date" value={saleInfo.date} onChange={e=>setSaleInfo(p=>({...p,date:e.target.value}))}/></Fld>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
          {tab==="manual"&&mode==="buy"&&<CardForm card={form} upd={upd}/>}
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:"16px 20px",borderTop:"1px solid "+col.border}}>
          <button style={btnO} onClick={onClose}>Cancel</button>
          {mode==="buy"&&tab==="photo"&&identified.length>0&&<button style={btnG} onClick={doAddAll}>+ Add {identified.length} Card{identified.length!==1?"s":""}</button>}
          {mode==="buy"&&tab==="manual"&&<button style={btnG} onClick={doAddManual}>+ Add Card</button>}
          {mode==="sell"&&matched.length>0&&<button style={btnD} onClick={doSellMatched}>💰 Mark {Object.values(selIds).filter(Boolean).length} Sold</button>}
        </div>
      </div>
    </Overlay>
  );
}

/* ════════════════════════════════════
   SELL SINGLE MODAL
════════════════════════════════════ */
function SellModal({card,onSell,onClose}){
  const [sd,setSd]=useState({price:"",date:new Date().toISOString().slice(0,10)});
  const profit=sd.price&&card.purchasePrice?parseFloat(sd.price)-parseFloat(card.purchasePrice):null;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:col.card,borderRadius:16,width:"100%",maxWidth:420,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+col.border}}>
          <div style={{fontSize:20,fontWeight:800}}>Mark as Sold</div>
          <button onClick={onClose} style={{...btnO,padding:"6px 12px"}}>✕</button>
        </div>
        <div style={{padding:20}}>
          <div style={{background:col.surface,borderRadius:10,padding:"14px 16px",marginBottom:18}}>
            <div style={{fontSize:18,fontWeight:800,color:col.text}}>{card.playerName}</div>
            <div style={{fontSize:12,color:col.muted,marginTop:2}}>{card.year} {card.brand} {card.set} · {card.gradingCompany} {card.grade}</div>
            <div style={{fontSize:12,color:col.muted,marginTop:4}}>Cost basis: {f$(card.purchasePrice)}</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <Fld l="Sale Price *"><Inp type="number" step="0.01" placeholder="0.00" value={sd.price} onChange={e=>setSd(p=>({...p,price:e.target.value}))}/></Fld>
            <Fld l="Sale Date"><Inp type="date" value={sd.date} onChange={e=>setSd(p=>({...p,date:e.target.value}))}/></Fld>
          </div>
          {profit!=null&&(
            <div style={{padding:"12px 16px",borderRadius:10,background:profit>=0?"#e8f5ee":"#fdecea"}}>
              <span style={{fontSize:18,fontWeight:800,color:profit>=0?col.green:col.red}}>{profit>=0?"+":""}{f$(profit)} ({fpct(card.purchasePrice?profit/parseFloat(card.purchasePrice)*100:null)})</span>
            </div>
          )}
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:"16px 20px",borderTop:"1px solid "+col.border}}>
          <button style={btnO} onClick={onClose}>Cancel</button>
          <button style={btnD} onClick={()=>{if(sd.price)onSell(sd);}}>Confirm Sale</button>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════
   DETAIL / EDIT MODAL
════════════════════════════════════ */
function DetailModal({card,readOnly,onClose,onUpdate,onDelete}){
  const [editing,setEditing]=useState(false);
  const [form,setForm]=useState({...card});
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));
  const pnl=card.purchasePrice&&(card.estimatedValue||card.lastSalePrice)?(card.estimatedValue||card.lastSalePrice)-card.purchasePrice:null;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:col.card,borderRadius:16,width:"100%",maxWidth:520,marginTop:20,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+col.border}}>
          <div style={{fontSize:20,fontWeight:800,color:col.text}}>{card.playerName}</div>
          <div style={{display:"flex",gap:8}}>
            {!readOnly&&!editing&&<button style={{...btnO,padding:"6px 12px",fontSize:12}} onClick={()=>setEditing(true)}>✏ Edit</button>}
            <button style={{...btnO,padding:"6px 12px"}} onClick={onClose}>✕</button>
          </div>
        </div>
        <div style={{padding:20,maxHeight:"75vh",overflowY:"auto"}}>
          {!editing?(
            <div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>
                {[["Year",card.year],["Brand",card.brand],["Set",card.set],["Grade",`${card.gradingCompany} ${card.grade}`],["Cert #",card.certNumber||"—"],["Status",STATUS_LBL[card.cardStatus]]].map(([l,v])=>(
                  <div key={l}><div style={lbl}>{l}</div><div style={{fontSize:15,color:col.text,fontWeight:600}}>{v||"—"}</div></div>
                ))}
              </div>
              {card.gradingCompany==="BGS"&&card.bgsCenter&&(
                <div style={{background:col.surface,borderRadius:10,padding:"12px 16px",marginBottom:14}}>
                  <div style={{...lbl,marginBottom:10}}>BGS Subgrades</div>
                  <div style={{display:"flex",gap:24}}>{[["Ctr",card.bgsCenter],["Cor",card.bgsCorners],["Edg",card.bgsEdges],["Srf",card.bgsSurface]].map(([l,v])=>(
                    <div key={l} style={{textAlign:"center"}}><div style={{fontSize:10,color:col.muted,marginBottom:3}}>{l}</div><div style={{fontSize:22,fontWeight:800,color:col.gold}}>{v||"—"}</div></div>
                  ))}</div>
                </div>
              )}
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:14}}>
                {card.isRookie&&<span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:4,background:"#dbeafe",color:"#1d4ed8"}}>Rookie Card</span>}
                {card.isAuto&&<span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:4,background:"#f3e8ff",color:"#7c3aed"}}>Autograph</span>}
                {card.isPatch&&<span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:4,background:"#dcfce7",color:"#15803d"}}>Patch/Relic</span>}
                {card.isSerialNumbered&&<span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:4,background:col.goldBg,color:col.gold}}>/{card.printRun} Print Run</span>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
                {[["Cost",f$(card.purchasePrice),""],["Last Sale",f$(card.lastSalePrice),""],["P&L",pnl!=null?f$(pnl):"—",pnl!=null?(pnl>=0?"pos":"neg"):""]].map(([l,v,t])=>(
                  <div key={l} style={{background:t==="pos"?"#e8f5ee":t==="neg"?"#fdecea":col.surface,borderRadius:10,padding:"12px 14px"}}>
                    <div style={lbl}>{l}</div>
                    <div style={{fontSize:18,fontWeight:800,color:t==="pos"?col.green:t==="neg"?col.red:col.text}}>{v}</div>
                  </div>
                ))}
              </div>
              {card.notes&&<div style={{fontSize:13,color:col.muted,fontStyle:"italic",padding:"12px 16px",background:col.surface,borderRadius:10}}>{card.notes}</div>}
            </div>
          ):<CardForm card={form} upd={upd}/>}
        </div>
        {editing&&(
          <div style={{display:"flex",gap:10,justifyContent:"space-between",padding:"16px 20px",borderTop:"1px solid "+col.border}}>
            <button style={{...btnD,padding:"6px 12px",fontSize:12}} onClick={()=>{if(confirm("Delete this card?"))onDelete(card.id);}}>🗑 Delete</button>
            <div style={{display:"flex",gap:10}}>
              <button style={btnO} onClick={()=>{setEditing(false);setForm({...card});}}>Cancel</button>
              <button style={btnG} onClick={()=>onUpdate(form)}>✓ Save</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════
   SETTINGS MODAL
════════════════════════════════════ */
function SettingsModal({onClose,onResetKey}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:col.card,borderRadius:16,width:"100%",maxWidth:400,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+col.border}}>
          <div style={{fontSize:20,fontWeight:800}}>⚙ Settings</div>
          <button onClick={onClose} style={{...btnO,padding:"6px 12px"}}>✕</button>
        </div>
        <div style={{padding:20}}>
          <div style={{background:col.surface,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontSize:14,fontWeight:700,color:col.text,marginBottom:4}}>API Key</div>
            <div style={{fontSize:12,color:col.muted,marginBottom:10}}>Your Anthropic API key is saved on this device. Reset it if you need to use a different key.</div>
            <button style={{...btnD,padding:"8px 14px",fontSize:12}} onClick={onResetKey}>Reset API Key</button>
          </div>
          <div style={{background:col.surface,borderRadius:10,padding:"14px 16px"}}>
            <div style={{fontSize:14,fontWeight:700,color:col.text,marginBottom:4}}>About</div>
            <div style={{fontSize:12,color:col.muted,lineHeight:1.6}}>
              Dad &amp; Lad's Card Vault<br/>
              Graded card inventory tracker<br/>
              Data stored locally on this device
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════
   MAIN APP
════════════════════════════════════ */
function App(){
  const [apiKey,setApiKey]=useState(null);
  const [profile,setProfile]=useState(null);
  const [view,setView]=useState("dashboard");
  const [mode,setMode]=useState("buy");
  const [dadCards,setDadCards]=useState([]);
  const [owenCards,setOwenCards]=useState([]);
  const [loading,setLoading]=useState(true);
  const [toasts,setToasts]=useState([]);
  const [showAdd,setShowAdd]=useState(false);
  const [showSell,setShowSell]=useState(null);
  const [showDetail,setShowDetail]=useState(null);
  const [showSettings,setShowSettings]=useState(false);
  const [refreshing,setRefreshing]=useState(false);
  const [prog,setProg]=useState({current:0,total:0,card:""});
  const [lastRefresh,setLastRefresh]=useState(null);
  const [search,setSearch]=useState("");
  const [fAlert,setFAlert]=useState("all");
  const [fStatus,setFStatus]=useState("all");

  useEffect(()=>{
    const key=localStorage.getItem("cv_api_key");
    if(key)setApiKey(key);
    const d=LS.get("cv_dad_inventory");if(d)setDadCards(JSON.parse(d.value));
    const o=LS.get("cv_owen_inventory");if(o)setOwenCards(JSON.parse(o.value));
    const lr=LS.get("cv_last_refresh");if(lr)setLastRefresh(lr.value);
    setLoading(false);
  },[]);

  const myCards=profile==="dad"?dadCards:owenCards;
  const otherCards=profile==="dad"?owenCards:dadCards;
  const otherName=profile==="dad"?"Owen":"Dad";

  const save=(p,cards)=>{
    LS.set(`cv_${p}_inventory`,JSON.stringify(cards));
    if(p==="dad")setDadCards(cards);else setOwenCards(cards);
  };

  const toast=(msg,type="info")=>{
    const id=uid();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),5000);
  };

  const addCards=cards=>{save(profile,[...myCards,...cards]);toast(`Added ${cards.length} card${cards.length!==1?"s":""}!`,"success");};
  const updateCard=(id,updates)=>save(profile,myCards.map(x=>x.id===id?{...x,...updates}:x));
  const deleteCard=(id)=>{save(profile,myCards.filter(x=>x.id!==id));setShowDetail(null);toast("Card deleted","info");};
  const sellCard=(id,sd)=>{save(profile,myCards.map(x=>x.id===id?{...x,cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"}:x));toast("Card marked as sold","success");};
  const sellBulk=(ids,sd)=>save(profile,myCards.map(x=>ids.includes(x.id)?{...x,cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"}:x));

  const runRefresh=async()=>{
    const active=myCards.filter(x=>x.cardStatus==="inventory");
    if(!active.length){toast("No active cards to refresh","info");return;}
    setRefreshing(true);let updated=[...myCards];let alertCount=0;
    for(let i=0;i<active.length;i++){
      const card=active[i];setProg({current:i+1,total:active.length,card:card.playerName});
      try{
        const p=await priceCheck(apiKey,card);
        if(p&&p.salesFound&&p.lastSalePrice){
          const a=alertOf({...card,lastSalePrice:p.lastSalePrice});
          if(a!=="normal")alertCount++;
          updated=updated.map(x=>x.id===card.id?{...x,lastSalePrice:p.lastSalePrice,lastSaleDate:p.lastSaleDate,estimatedValue:p.avgRecentPrice||p.lastSalePrice,alertStatus:a}:x);
        }
      }catch(e){console.log("Price check error:",e.message);}
      if(i<active.length-1)await new Promise(r=>setTimeout(r,500));
    }
    save(profile,updated);
    const now=new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    LS.set("cv_last_refresh",now);setLastRefresh(now);
    setRefreshing(false);setProg({current:0,total:0,card:""});
    toast(`Done · ${alertCount} alert${alertCount!==1?"s":""}`,alertCount>0?"info":"success");
  };

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",fontSize:18,color:col.gold,fontWeight:700}}>Loading…</div>;

  if(!apiKey)return<SetupScreen onSave={k=>{localStorage.setItem("cv_api_key",k);setApiKey(k);}}/>;

  if(!profile)return(
    <ProfileScreen
      counts={{dad:dadCards.length,owen:owenCards.length}}
      onSelect={p=>{setProfile(p);setView("dashboard");}}
      onSettings={()=>setShowSettings(true)}
    />
  );

  return(
    <div style={{minHeight:"100vh",background:col.bg}}>
      <Nav profile={profile} mode={mode} view={view} onMode={setMode} onView={v=>{setView(v);setSearch("");setFAlert("all");setFStatus("all");}} onSwitch={()=>setProfile(null)}/>

      {view==="dashboard"&&<Dashboard cards={myCards} onRefresh={runRefresh} onAdd={()=>setShowAdd(true)} refreshing={refreshing} prog={prog} lastRefresh={lastRefresh}/>}
      {(view==="inventory"||view==="browse")&&(
        <InventoryView
          cards={view==="browse"?otherCards:myCards}
          onAdd={()=>setShowAdd(true)} onSell={x=>setShowSell(x)} onView={x=>setShowDetail(x)}
          mode={mode} readOnly={view==="browse"} ownerName={otherName}
          search={search} setSearch={setSearch} fAlert={fAlert} setFAlert={setFAlert} fStatus={fStatus} setFStatus={setFStatus}
        />
      )}

      {showAdd&&<AddModal apiKey={apiKey} mode={mode} myCards={myCards} onAdd={addCards} onSellBulk={sellBulk} onClose={()=>setShowAdd(false)} toast={toast}/>}
      {showSell&&<SellModal card={showSell} onSell={sd=>{sellCard(showSell.id,sd);setShowSell(null);}} onClose={()=>setShowSell(null)}/>}
      {showDetail&&<DetailModal card={showDetail} readOnly={view==="browse"} onClose={()=>setShowDetail(null)} onUpdate={u=>{updateCard(showDetail.id,u);setShowDetail(null);toast("Saved","success");}} onDelete={id=>deleteCard(id)}/>}
      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)} onResetKey={()=>{localStorage.removeItem("cv_api_key");setApiKey(null);setShowSettings(false);}}/>}

      <div style={{position:"fixed",bottom:20,right:20,display:"flex",flexDirection:"column",gap:8,zIndex:200,maxWidth:300}}>
        {toasts.map(t=>(
          <div key={t.id} style={{background:col.card,borderLeft:`4px solid ${t.type==="success"?col.green:t.type==="error"?col.red:col.gold}`,borderRadius:10,padding:"12px 16px",fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.15)"}}>
            {t.msg}
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
