var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef,useMemo=React.useMemo;

// ── Constants ──
var GCS=["PSA","BGS","SGC","CGC"];
var BRANDS=["Topps","Panini","Bowman","Upper Deck","Donruss","Fleer","Stadium Club","Finest","Select","Optic","Mosaic","National Treasures","Chronicles","Other"];
var WHERE=["eBay","Card Show","Local Shop","Alt","Fanatics","PWCC","Goldin","COMC","Facebook Group","Other"];
var STATUS_LBL={inventory:"In Inventory",sold:"Sold",consigned:"Consigned",grading:"Out for Grading"};
var BLANK={playerName:"",year:"",brand:"",set:"",isRookie:false,isAuto:false,isPatch:false,isSerialNumbered:false,printRun:"",gradingCompany:"PSA",grade:"",certNumber:"",bgsCenter:"",bgsCorners:"",bgsEdges:"",bgsSurface:"",purchasePrice:"",purchaseDate:new Date().toISOString().slice(0,10),wherePurchased:"",notes:""};

// ── Helpers ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtMoney(n){return(n!=null&&n!=="")?("$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})):"—";}
function fmtPct(n){return n!=null?((n>0?"+":"")+Number(n).toFixed(1)+"%"):"—";}
function fmtDate(s){return s?new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"}):"—";}
function lsGet(k){try{var v=localStorage.getItem(k);return v?{value:v}:null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

// ── Alert / ROI logic ──
function alertOf(card){
  if(!card.purchasePrice||!card.lastSalePrice)return"normal";
  var pct=((card.lastSalePrice-card.purchasePrice)/card.purchasePrice)*100;
  var gain=card.lastSalePrice-card.purchasePrice;
  if(gain<25)return"normal";
  if(pct>=25)return"urgent_sale";
  if(pct>=10)return"time_to_sell";
  return"normal";
}

function roiPct(card){
  if(!card.purchasePrice||!card.lastSalePrice)return null;
  return((card.lastSalePrice-card.purchasePrice)/card.purchasePrice)*100;
}

function holdSignal(card){
  var roi=roiPct(card);
  if(roi==null)return"unknown";
  if(roi>=25)return"sell";
  if(roi>=10)return"watch";
  if(roi>=0)return"hold";
  return"underwater";
}

function sellScore(card){
  // Higher = sell sooner. Based on ROI % + alert status
  var roi=roiPct(card)||0;
  var bonus=card.alertStatus==="urgent_sale"?50:card.alertStatus==="time_to_sell"?25:0;
  return roi+bonus;
}

// ── Image compression ──
function compressImage(dataUrl,maxPx,quality){
  return new Promise(function(resolve,reject){
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){var s=maxPx/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        var cv=document.createElement("canvas");
        cv.width=w;cv.height=h;
        var ctx=cv.getContext("2d");
        if(!ctx){reject(new Error("No canvas"));return;}
        ctx.drawImage(img,0,0,w,h);
        var out=cv.toDataURL("image/jpeg",quality);
        resolve({b64:out.split(",")[1],mime:"image/jpeg",w:w,h:h});
      }catch(e){reject(e);}
    };
    img.onerror=function(){reject(new Error("Load failed"));};
    img.src=dataUrl;
  });
}

// ── API ──
async function apiCall(key,messages,useSearch){
  var body={model:"claude-sonnet-4-6",max_tokens:1500,messages:messages};
  if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  var resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(body)
  });
  var text=await resp.text();
  var data;
  try{data=JSON.parse(text);}catch(e){throw new Error("Bad API response. Check your key.");}
  if(data.error)throw new Error(data.error.message||"API error");
  return data;
}

async function identifyCardsFromPhoto(key,b64,mime){
  var data=await apiCall(key,[{role:"user",content:[
    {type:"image",source:{type:"base64",media_type:mime,data:b64}},
    {type:"text",text:"Identify every graded sports card in this photo. Output ONLY a raw JSON array, no markdown, no explanation. Each object: {playerName,year,brand,set,gradingCompany,grade,isRookie,isAuto,isPatch,isSerialNumbered,printRun,certNumber,bgsCenter,bgsCorners,bgsEdges,bgsSurface}. gradingCompany must be PSA, BGS, SGC, or CGC. Return [] if none found."}
  ]}],false);
  var txt=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
  var s=txt.indexOf("["),e=txt.lastIndexOf("]");
  if(s===-1||e===-1)return[];
  try{return JSON.parse(txt.slice(s,e+1));}catch(err){return[];}
}

async function lookupPrice(key,card){
  var q=card.year+" "+card.brand+" "+card.set+" "+card.playerName+" "+card.gradingCompany+" "+card.grade;
  if(card.isSerialNumbered&&card.printRun)q+=" /"+card.printRun;
  var prompt='Search for recent SOLD listings of this graded sports card: "'+q+'". '+
    'Search eBay completed listings, Goldin Auctions, PWCC, and Heritage Auctions sold results. '+
    'Find the 3-5 most recent actual sold prices — ignore active listings. '+
    'Return ONLY a JSON object, no markdown: '+
    '{"lastSalePrice":number_or_null,"lastSaleDate":"YYYY-MM-DD_or_null","avgRecentPrice":number_or_null,"salesFound":true_or_false,"source":"where you found it"}. '+
    'If no sales found, return {"lastSalePrice":null,"lastSaleDate":null,"avgRecentPrice":null,"salesFound":false,"source":null}.';
  var data=await apiCall(key,[{role:"user",content:prompt}],true);
  var txt=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
  var s=txt.indexOf("{"),e=txt.lastIndexOf("}");
  if(s===-1||e===-1)return null;
  try{return JSON.parse(txt.slice(s,e+1));}catch(err){return null;}
}

async function lookupWatchlistCard(key,query){
  var prompt='Search eBay completed listings and recent auction results for this graded sports card: "'+query+'". '+
    'Find the 3-5 most recent sold prices. '+
    'Return ONLY a JSON object, no markdown: '+
    '{"lastSalePrice":number_or_null,"avgRecentPrice":number_or_null,"lowestRecentPrice":number_or_null,"highestRecentPrice":number_or_null,"salesFound":boolean,"priceNote":"brief note on market trend"}. '+
    'If not found: {"lastSalePrice":null,"avgRecentPrice":null,"lowestRecentPrice":null,"highestRecentPrice":null,"salesFound":false,"priceNote":"No recent sales found"}.';
  var data=await apiCall(key,[{role:"user",content:prompt}],true);
  var txt=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
  var s=txt.indexOf("{"),e=txt.lastIndexOf("}");
  if(s===-1||e===-1)return null;
  try{return JSON.parse(txt.slice(s,e+1));}catch(err){return null;}
}

function matchToInventory(identified,inventory){
  return identified.map(function(id){
    var match=inventory.find(function(c){
      if(c.cardStatus!=="inventory")return false;
      var a=(id.playerName||"").toLowerCase(),b=(c.playerName||"").toLowerCase();
      return a&&b&&(a.includes(b)||b.includes(a));
    })||null;
    return Object.assign({},id,{match:match});
  });
}

// ── CSV Export ──
function exportCSV(cards){
  var headers=["Player","Year","Brand","Set","Grading Co","Grade","Cert#","RC","Auto","Patch","Serial","Print Run","Purchase Price","Purchase Date","Where","Last Sale Price","Last Sale Date","P&L $","P&L %","Alert","Status","Sale Price","Sale Date","Notes"];
  var rows=cards.map(function(c){
    var pnl=c.purchasePrice&&c.lastSalePrice?c.lastSalePrice-c.purchasePrice:null;
    var pnlPct=c.purchasePrice&&pnl!=null?pnl/c.purchasePrice*100:null;
    return[
      c.playerName||"",c.year||"",c.brand||"",c.set||"",
      c.gradingCompany||"",c.grade||"",c.certNumber||"",
      c.isRookie?"Yes":"No",c.isAuto?"Yes":"No",c.isPatch?"Yes":"No",c.isSerialNumbered?"Yes":"No",c.printRun||"",
      c.purchasePrice||"",c.purchaseDate||"",c.wherePurchased||"",
      c.lastSalePrice||"",c.lastSaleDate||"",
      pnl!=null?pnl.toFixed(2):"",pnlPct!=null?pnlPct.toFixed(1)+"%":"",
      c.alertStatus||"normal",c.cardStatus||"inventory",
      c.salePrice||"",c.saleDate||"",c.notes||""
    ].map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(",");
  });
  var csv=[headers.join(",")].concat(rows).join("\n");
  var blob=new Blob([csv],{type:"text/csv"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="CardVault_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();URL.revokeObjectURL(url);
}

var C={gold:"#c9922a",goldBg:"rgba(201,146,42,0.1)",green:"#2e7d52",red:"#c0392b",amber:"#d68910",text:"#1a1a1a",muted:"#888",border:"#e5e1d8",bg:"#f5f4f0",card:"#fff",surface:"#f0ede6"};

var BO={padding:"10px 18px",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",background:"transparent",border:"1px solid "+C.border,color:C.muted,display:"inline-flex",alignItems:"center",gap:6};
var BD={padding:"10px 18px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",background:"#fdecea",border:"1px solid #f5a0a0",color:C.red,display:"inline-flex",alignItems:"center",gap:6};

// ════════════ SETUP SCREEN ════════════
function SetupScreen(p){
  var onSave=p.onSave;
  var [key,setKey]=useState("");
  var [err,setErr]=useState("");
  var [busy,setBusy]=useState(false);
  async function handleSave(){
    if(!key.trim()){setErr("Please paste your Anthropic API key");return;}
    if(!key.trim().startsWith("sk-ant-")){setErr("Key should start with sk-ant-");return;}
    setBusy(true);setErr("");
    try{await apiCall(key.trim(),[{role:"user",content:"Say OK"}],false);onSave(key.trim());}
    catch(e){setErr("Connection failed: "+e.message);}
    setBusy(false);
  }
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,background:C.bg}}>
      <div style={{width:"100%",maxWidth:480}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:6,textTransform:"uppercase",color:C.gold,marginBottom:8}}>Dad &amp; Lad's</div>
          <div style={{fontSize:36,fontWeight:800,color:C.text}}>CARD VAULT</div>
          <div style={{fontSize:13,color:C.muted,marginTop:8}}>One-time setup — takes 2 minutes</div>
        </div>
        <div style={{background:C.card,borderRadius:14,padding:24,border:"1px solid "+C.border}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:6}}>Enter your Anthropic API Key</div>
          <div style={{fontSize:13,color:C.muted,marginBottom:20,lineHeight:1.7}}>
            Powers photo ID and price searches. Only entered once.<br/><br/>
            <strong style={{color:C.text}}>To find your key:</strong><br/>
            1. Go to <strong>console.anthropic.com</strong><br/>
            2. Click <strong>API Keys</strong> → <strong>Create Key</strong><br/>
            3. Copy it (starts with <code style={{background:C.surface,padding:"1px 5px",borderRadius:3}}>sk-ant-</code>) and paste below
          </div>
          <Fld l="Anthropic API Key"><Inp type="password" value={key} onChange={function(e){setKey(e.target.value);}} placeholder="sk-ant-api03-..."/></Fld>
          {err&&<div style={{marginTop:10,padding:"8px 12px",background:"#fdecea",borderRadius:6,fontSize:12,color:C.red}}>{err}</div>}
          <button style={{...BG,width:"100%",justifyContent:"center",marginTop:16}} onClick={handleSave} disabled={busy}>{busy?"Testing…":"Save & Get Started →"}</button>
        </div>
        <div style={{textAlign:"center",fontSize:11,color:C.muted,marginTop:14}}>Stored only on this device. ~$0.10 per 100 card photos.</div>
      </div>
    </div>
  );
}

// ════════════ DASHBOARD ════════════
function Dashboard(p){
  var cards=p.cards,onRefresh=p.onRefresh,onAdd=p.onAdd,refreshing=p.refreshing,prog=p.prog,lastRefresh=p.lastRefresh,onExport=p.onExport,onBulkPrice=p.onBulkPrice;
  var active=cards.filter(function(x){return x.cardStatus==="inventory";});
  var cost=active.reduce(function(s,x){return s+(parseFloat(x.purchasePrice)||0);},0);
  var val=active.reduce(function(s,x){return s+(x.estimatedValue||parseFloat(x.purchasePrice)||0);},0);
  var pnl=val-cost;
  var pnlPct=cost>0?pnl/cost*100:null;
  var alerts=active.filter(function(x){return x.alertStatus!=="normal";});
  var urgent=active.filter(function(x){return x.alertStatus==="urgent_sale";});
  var sellNow=active.filter(function(x){return holdSignal(x)==="sell";});
  return(
    <div style={{padding:16,maxWidth:800,margin:"0 auto"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
        {[["Cards",active.length,C.gold],["Cost Basis",fmtMoney(cost),C.text],["Est. Value",fmtMoney(val),C.text],["Gain / Loss",fmtMoney(pnl)+" "+fmtPct(pnlPct),pnl>=0?C.green:C.red],["Alerts",alerts.length,alerts.length>0?C.red:C.text],["Ready to Sell",sellNow.length,sellNow.length>0?C.green:C.text]].map(function(item){
          var l=item[0],v=item[1],c=item[2];
          return(
            <div key={l} style={{background:C.card,borderRadius:10,padding:"12px 14px",border:"1px solid "+C.border}}>
              <div style={{fontSize:9,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:6}}>{l}</div>
              <div style={{fontSize:18,fontWeight:800,color:c,lineHeight:1}}>{v}</div>
            </div>
          );
        })}
      </div>

      <div style={{background:C.card,borderRadius:12,padding:"16px 18px",marginBottom:16,border:"1px solid "+C.border}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:4}}>🔄 Morning Price Refresh</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:12}}>
          {refreshing?"Checking "+prog.card+"… ("+prog.current+"/"+prog.total+")":lastRefresh?"Last run: "+lastRefresh:"Searches eBay sold listings for all "+active.length+" active cards"}
        </div>
        {refreshing&&<div style={{height:4,background:C.border,borderRadius:2,marginBottom:12,overflow:"hidden"}}><div style={{height:"100%",background:C.gold,width:(prog.total?prog.current/prog.total*100:0)+"%",transition:"width .3s"}}></div></div>}
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <button style={BO} onClick={onAdd}>+ Add Card</button>
          <button style={BO} onClick={onBulkPrice}>📋 Bulk Price Update</button>
          <button style={BO} onClick={onExport}>⬇ Export CSV</button>
          <button style={{...BG,opacity:refreshing||!active.length?0.4:1}} onClick={onRefresh} disabled={refreshing||!active.length}>{refreshing?"Running…":"Run Refresh"}</button>
        </div>
      </div>

      {alerts.length>0&&(
        <div>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:12}}>Active Alerts</div>
          {alerts.map(function(x){
            var pct=x.purchasePrice&&x.lastSalePrice?(x.lastSalePrice-x.purchasePrice)/x.purchasePrice*100:null;
            var urg=x.alertStatus==="urgent_sale";
            return(

                  <div style={{fontSize:16,fontWeight:800}}>{x.playerName}</div>

// ════════════ WATCHLIST ════════════
function WatchlistView(p){
  var apiKey=p.apiKey,watchlist=p.watchlist,onUpdate=p.onUpdate,toast=p.toast;
  var [query,setQuery]=useState("");
  var [budget,setBudget]=useState("");
  var [targetRoi,setTargetRoi]=useState("20");
  var [checking,setChecking]=useState(null);

  async function addItem(){
    if(!query.trim()){toast("Enter a card to watch","error");return;}
    var item={id:uid(),query:query.trim(),budget:parseFloat(budget)||null,targetRoi:parseFloat(targetRoi)||20,lastSalePrice:null,avgRecentPrice:null,lowestRecentPrice:null,priceNote:"",addedDate:new Date().toISOString().slice(0,10),lastChecked:null};
    onUpdate(watchlist.concat([item]));
    setQuery("");setBudget("");
  }

  async function checkPrices(item){
    setChecking(item.id);
    try{
      var result=await lookupWatchlistCard(apiKey,item.query);
      if(result){
        var updated=watchlist.map(function(w){return w.id===item.id?Object.assign({},w,{lastSalePrice:result.lastSalePrice,avgRecentPrice:result.avgRecentPrice,lowestRecentPrice:result.lowestRecentPrice,highestRecentPrice:result.highestRecentPrice,priceNote:result.priceNote||"",lastChecked:new Date().toISOString().slice(0,10)}):w;});
        onUpdate(updated);
        toast("Prices updated for "+item.query,"success");
      }
    }catch(e){toast("Price check failed: "+e.message,"error");}
    setChecking(null);
  }

  function removeItem(id){
    onUpdate(watchlist.filter(function(w){return w.id!==id;}));
  }

  function isBuySignal(item){
    if(!item.lowestRecentPrice||!item.budget)return false;
    return item.budget>=item.lowestRecentPrice;
  }

  function projectedRoi(item){
    if(!item.lowestRecentPrice||!item.budget||!item.avgRecentPrice)return null;
    return(item.avgRecentPrice-item.budget)/item.budget*100;
  }

  return(
    <div style={{padding:16,maxWidth:800,margin:"0 auto"}}>
      <div style={{background:C.card,borderRadius:12,padding:"16px 18px",marginBottom:16,border:"1px solid "+C.border}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:14}}>🔍 Add Card to Watchlist</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr",gap:10,marginBottom:10}}>
          <Fld l="Card (player, year, brand, set, grade)"><Inp value={query} onChange={function(e){setQuery(e.target.value);}} placeholder="e.g. Luka Doncic 2018 Prizm PSA 10"/></Fld>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <Fld l="My Max Buy Price ($)"><Inp type="number" step="0.01" value={budget} onChange={function(e){setBudget(e.target.value);}} placeholder="e.g. 250.00"/></Fld>
          <Fld l="Target ROI (%)"><Inp type="number" value={targetRoi} onChange={function(e){setTargetRoi(e.target.value);}} placeholder="e.g. 20"/></Fld>
        </div>
        <button style={BG} onClick={addItem}>+ Add to Watchlist</button>
      </div>

      {watchlist.length===0&&<div style={{textAlign:"center",padding:48,color:C.muted}}><div style={{fontSize:28,marginBottom:10}}>👀</div><div style={{fontWeight:700,fontSize:16}}>No cards on your watchlist yet</div><div style={{fontSize:13,marginTop:6}}>Add cards you're considering buying to track their prices</div></div>}

      {watchlist.map(function(item){
        var roi=projectedRoi(item);
        var buySignal=isBuySignal(item);
        var busy=checking===item.id;
        return(
          <div key={item.id} style={{background:C.card,border:"1px solid "+(buySignal?C.green:C.border),borderRadius:12,padding:"14px 16px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div style={{flex:1}}>
                {buySignal&&<div style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:3,background:C.green,color:"#fff",display:"inline-block",marginBottom:6,letterSpacing:1}}>BUY SIGNAL</div>}
                <div style={{fontSize:16,fontWeight:800,color:C.text}}>{item.query}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>Added {fmtDate(item.addedDate)}{item.lastChecked?" · Checked "+fmtDate(item.lastChecked):""}</div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button style={{...BO,padding:"5px 10px",fontSize:11}} onClick={function(){checkPrices(item);}} disabled={busy}>{busy?"Checking…":"Check Prices"}</button>
                <button style={{...BD,padding:"5px 10px",fontSize:11}} onClick={function(){removeItem(item.id);}}>✕</button>
              </div>
            </div>
            {item.lastSalePrice&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:10}}>
                {[["Last Sale",fmtMoney(item.lastSalePrice)],["Avg Recent",fmtMoney(item.avgRecentPrice)],["Lowest Recent",fmtMoney(item.lowestRecentPrice)]].map(function(row){
                  return(
                    <div key={row[0]} style={{background:C.surface,borderRadius:8,padding:"8px 10px"}}>
                      <div style={{fontSize:9,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:C.muted,marginBottom:4}}>{row[0]}</div>
                      <div style={{fontSize:16,fontWeight:800,color:C.text}}>{row[1]}</div>
                    </div>
                  );
                })}
              </div>
            )}
            <div style={{display:"flex",gap:10,flexWrap:"wrap",fontSize:12,color:C.muted}}>
              {item.budget&&<span>Max buy: <strong style={{color:C.text}}>{fmtMoney(item.budget)}</strong></span>}
              {item.targetRoi&&<span>Target ROI: <strong style={{color:C.text}}>{item.targetRoi}%</strong></span>}
              {roi!=null&&<span>Projected ROI at max buy: <strong style={{color:roi>=0?C.green:C.red}}>{fmtPct(roi)}</strong></span>}
              {item.priceNote&&<span style={{fontStyle:"italic"}}>"{item.priceNote}"</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

          <div key={x.id} style={{background:C.card,border:"1px solid "+(alertColor||C.border),borderRadius:12,padding:"14px 16px",marginBottom:10}}>

        );
      })}

  );
}

// ════════════ ADD MODAL ════════════
function AddModal(p){
  var apiKey=p.apiKey,mode=p.mode,myCards=p.myCards,onAdd=p.onAdd,onSellBulk=p.onSellBulk,onClose=p.onClose,toast=p.toast;
  var [tab,setTab]=useState("photo");
  var [img,setImg]=useState(null);
  var [b64,setB64]=useState(null);
  var [mime,setMime]=useState(null);
  var [imgInfo,setImgInfo]=useState("");
  var [busy,setBusy]=useState(false);
  var [statusMsg,setStatusMsg]=useState("");
  var [identified,setIdentified]=useState([]);
  var [perCardInfo,setPerCardInfo]=useState([]);
  var [matched,setMatched]=useState([]);
  var [form,setForm]=useState(Object.assign({},BLANK));
  var [saleInfo,setSaleInfo]=useState({price:"",date:new Date().toISOString().slice(0,10)});
  var [selIds,setSelIds]=useState({});
  var fileRef=useRef();
  function upd(k,v){setForm(function(prev){return Object.assign({},prev,{[k]:v});});}

  function handleFile(f){
    if(!f)return;
    setStatusMsg("Compressing image…");
    var r=new FileReader();
    r.onload=async function(e){
      var raw=e.target.result;
      setImg(raw);
      try{
        var c1=await compressImage(raw,900,0.78);
        var fb=c1.b64,fw=c1.w,fh=c1.h,sz=Math.round(c1.b64.length*0.75/1024);
        if(sz>350){var c2=await compressImage(raw,600,0.65);fb=c2.b64;fw=c2.w;fh=c2.h;sz=Math.round(c2.b64.length*0.75/1024);}
        setB64(fb);setMime("image/jpeg");setImgInfo(fw+"×"+fh+"px · ~"+sz+"KB");setStatusMsg("Ready — tap Identify Cards");
      }catch(err){setB64(raw.split(",")[1]);setMime(f.type||"image/jpeg");setStatusMsg("Ready — tap Identify Cards");}
    };
    r.readAsDataURL(f);
  }

  async function doIdentify(){
    if(!b64)return;
    setBusy(true);setStatusMsg("Reading card labels…");
    try{
      var cards=await identifyCardsFromPhoto(apiKey,b64,mime);
      if(!cards.length){setStatusMsg("No graded cards found — try a clearer photo");setBusy(false);return;}
      setStatusMsg("Found "+cards.length+" card"+(cards.length!==1?"s":"")+"!");
      if(mode==="sell"){
        var m=matchToInventory(cards,myCards);
        setMatched(m);
        var s={};m.forEach(function(x){if(x.match)s[x.match.id]=true;});setSelIds(s);
      }else{
        setIdentified(cards);
        setPerCardInfo(cards.map(function(){return{purchasePrice:"",purchaseDate:new Date().toISOString().slice(0,10),wherePurchased:""};} ));
      }
    }catch(e){setStatusMsg("Error: "+e.message);toast("Error: "+e.message,"error");}
    setBusy(false);
  }

  async function doAddAll(){
    var toAdd=identified.map(function(x,i){
      var info=perCardInfo[i]||{};
      return Object.assign({},BLANK,x,{id:uid(),addedDate:new Date().toISOString().slice(0,10),cardStatus:"inventory",alertStatus:"normal",lastSalePrice:null,lastSaleDate:null,estimatedValue:null,purchasePrice:info.purchasePrice||"",purchaseDate:info.purchaseDate||new Date().toISOString().slice(0,10),wherePurchased:info.wherePurchased||""});
    });
    onAdd(toAdd);onClose();
  }

  async function doSellMatched(){
    var ids=Object.keys(selIds).filter(function(k){return selIds[k];});
    if(!ids.length){toast("Select at least one card","error");return;}
    if(!saleInfo.price){toast("Enter a sale price","error");return;}
    onSellBulk(ids,saleInfo);onClose();
  }

  async function doAddManual(){
    if(!form.playerName||!form.grade){toast("Player name and grade required","error");return;}
    onAdd([Object.assign({},form,{id:uid(),addedDate:new Date().toISOString().slice(0,10),cardStatus:"inventory",alertStatus:"normal",lastSalePrice:null,lastSaleDate:null,estimatedValue:null})]);
    onClose();
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:C.card,borderRadius:16,width:"100%",maxWidth:560,marginTop:20,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+C.border}}>
          <div style={{fontSize:20,fontWeight:800}}>{mode==="sell"?"Sell Cards":"Add Cards"}</div>
          <button onClick={onClose} style={{...BO,padding:"6px 12px"}}>✕</button>
        </div>
        <div style={{padding:20,maxHeight:"75vh",overflowY:"auto"}}>
          {mode==="buy"&&<div style={{display:"flex",borderBottom:"1px solid "+C.border,marginBottom:18}}>{[["photo","📷 Photo"],["manual","📝 Manual"]].map(function(item){var t=item[0],l=item[1];return <button key={t} onClick={function(){setTab(t);}} style={{padding:"10px 18px",fontSize:12,fontWeight:700,cursor:"pointer",border:"none",background:"transparent",color:tab===t?C.gold:C.muted,borderBottom:tab===t?"2px solid "+C.gold:"2px solid transparent"}}>{l}</button>;})}</div>}

          {(tab==="photo"||mode==="sell")&&(
            <div>
              {!img?(
                <div onClick={function(){fileRef.current.click();}} style={{border:"2px dashed "+C.border,borderRadius:12,padding:36,textAlign:"center",cursor:"pointer"}}>
                  <div style={{fontSize:44,marginBottom:12}}>📷</div>
                  <div style={{fontSize:15,color:C.muted,fontWeight:700}}>Tap to upload photo</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:5}}>{mode==="sell"?"Cards you're selling":"One card or a whole pile"}</div>
                  <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={function(e){handleFile(e.target.files[0]);}}/>
                </div>
              ):(
                <div>
                  <img src={img} style={{width:"100%",maxHeight:240,objectFit:"contain",borderRadius:10,border:"1px solid "+C.border,marginBottom:10}} alt="Cards"/>
                  {imgInfo&&<div style={{fontSize:11,color:C.muted,textAlign:"center",marginBottom:6}}>{imgInfo}</div>}
                  {statusMsg&&<div style={{fontSize:12,fontWeight:700,textAlign:"center",marginBottom:12,padding:"7px 12px",borderRadius:6,background:statusMsg.startsWith("Error")?C.red+"22":C.gold+"22",color:statusMsg.startsWith("Error")?C.red:C.gold}}>{statusMsg}</div>}
                  <div style={{display:"flex",gap:10,marginBottom:16}}>
                    <button style={BO} onClick={function(){setImg(null);setB64(null);setIdentified([]);setMatched([]);setStatusMsg("");setImgInfo("");}}>🗑 Clear</button>
                    <button style={{...BG,flex:1,justifyContent:"center",opacity:busy?0.5:1}} onClick={doIdentify} disabled={busy}>{busy?"Reading labels…":"Identify Cards"}</button>
                  </div>

                  {mode==="buy"&&identified.length>0&&(
                    <div>
                      <div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:10}}>Identified {identified.length} card{identified.length!==1?"s":""} — enter purchase info for each</div>
                      {identified.map(function(x,i){
                        var info=perCardInfo[i]||{};
                        return(
                          <div key={i} style={{background:C.surface,borderRadius:10,padding:"12px 14px",marginBottom:10}}>
                            <div style={{fontSize:14,fontWeight:800,color:C.text,marginBottom:2}}>{x.playerName}</div>
                            <div style={{fontSize:11,color:C.muted,marginBottom:10}}>{x.year} {x.brand} {x.set} · {x.gradingCompany} {x.grade}{x.isRookie?" · RC":""}{x.isAuto?" · AUTO":""}</div>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                              <Fld l="Purchase Price">
                                <Inp type="number" step="0.01" placeholder="0.00" value={info.purchasePrice||""}
                                  onChange={function(e){var v=e.target.value;setPerCardInfo(function(prev){var n=prev.slice();n[i]=Object.assign({},n[i],{purchasePrice:v});return n;});}}/>
                              </Fld>
                              <Fld l="Purchase Date">
                                <Inp type="date" value={info.purchaseDate||new Date().toISOString().slice(0,10)}
                                  onChange={function(e){var v=e.target.value;setPerCardInfo(function(prev){var n=prev.slice();n[i]=Object.assign({},n[i],{purchaseDate:v});return n;});}}/>
                              </Fld>
                              <Fld l="Where Purchased" s2={true}>
                                <Sel value={info.wherePurchased||""}
                                  onChange={function(e){var v=e.target.value;setPerCardInfo(function(prev){var n=prev.slice();n[i]=Object.assign({},n[i],{wherePurchased:v});return n;});}}>
                                  <option value="">Select…</option>{WHERE.map(function(w){return <option key={w}>{w}</option>;})}
                                </Sel>
                              </Fld>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {mode==="sell"&&matched.length>0&&(
                    <div>
                      <div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:10}}>Matched to inventory</div>
                      {matched.map(function(m,i){
                        return(
                          <div key={i} style={{background:C.surface,border:"1px solid "+(m.match?C.green:C.red),borderRadius:8,padding:"10px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:12,opacity:m.match?1:0.6}}>
                            {m.match&&<input type="checkbox" checked={!!selIds[m.match.id]} onChange={function(e){var id=m.match.id;var chk=e.target.checked;setSelIds(function(prev){var n=Object.assign({},prev);n[id]=chk;return n;});}} style={{width:17,height:17,accentColor:C.gold}}/>}
                            <div style={{flex:1}}>
                              <div style={{fontSize:15,fontWeight:800}}>{m.playerName}</div>
                              <div style={{fontSize:11,color:C.muted}}>{m.year} {m.brand} {m.set} · {m.gradingCompany} {m.grade}</div>
                              <div style={{fontSize:11,marginTop:3,color:m.match?C.green:C.red}}>{m.match?"✓ Found · Cost "+fmtMoney(m.match.purchasePrice):"Not in inventory"}</div>
                            </div>
                          </div>
                        );
                      })}
                      <div style={{background:C.surface,borderRadius:10,padding:"14px 16px",marginTop:10}}>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                          <Fld l="Sale Price (total)"><Inp type="number" step="0.01" placeholder="0.00" value={saleInfo.price} onChange={function(e){setSaleInfo(function(prev){return Object.assign({},prev,{price:e.target.value});});}}/></Fld>
                          <Fld l="Sale Date"><Inp type="date" value={saleInfo.date} onChange={function(e){setSaleInfo(function(prev){return Object.assign({},prev,{date:e.target.value});});}}/></Fld>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
          {tab==="manual"&&mode==="buy"&&<CardForm card={form} upd={upd}/>}
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:"16px 20px",borderTop:"1px solid "+C.border}}>
          <button style={BO} onClick={onClose}>Cancel</button>
          {mode==="buy"&&tab==="photo"&&identified.length>0&&<button style={BG} onClick={doAddAll}>+ Add {identified.length} Card{identified.length!==1?"s":""}</button>}
          {mode==="buy"&&tab==="manual"&&<button style={BG} onClick={doAddManual}>+ Add Card</button>}
          {mode==="sell"&&matched.length>0&&<button style={BD} onClick={doSellMatched}>💰 Mark {Object.keys(selIds).filter(function(k){return selIds[k];}).length} Sold</button>}
        </div>
      </div>
    </div>
  );
}

// ════════════ BULK PRICE MODAL ════════════
function BulkPriceModal(p){
  var cards=p.cards,onSave=p.onSave,onClose=p.onClose;
  var active=cards.filter(function(x){return x.cardStatus==="inventory";});
  var [prices,setPrices]=useState(function(){
    var init={};
    active.forEach(function(c){init[c.id]={price:c.lastSalePrice||"",date:c.lastSaleDate||new Date().toISOString().slice(0,10)};});
    return init;
  });

  function handleSave(){
    var updated=cards.map(function(c){
      var entry=prices[c.id];
      if(!entry||!entry.price)return c;
      var price=parseFloat(entry.price);
      return Object.assign({},c,{lastSalePrice:price,lastSaleDate:entry.date||new Date().toISOString().slice(0,10),alertStatus:alertOf(Object.assign({},c,{lastSalePrice:price})),estimatedValue:price});
    });
    onSave(updated);
    onClose();
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:C.card,borderRadius:16,width:"100%",maxWidth:620,marginTop:20,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+C.border}}>
          <div style={{fontSize:20,fontWeight:800}}>📋 Bulk Price Update</div>
          <button onClick={onClose} style={{...BO,padding:"6px 12px"}}>✕</button>
        </div>
        <div style={{padding:20,maxHeight:"75vh",overflowY:"auto"}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:16,lineHeight:1.6}}>Enter last known sale prices for your active cards. Leave blank to keep existing values. Use this after checking Card Ladder or 130point manually.</div>
          {active.map(function(c){
            var entry=prices[c.id]||{price:"",date:new Date().toISOString().slice(0,10)};
            var pnl=c.purchasePrice&&entry.price?parseFloat(entry.price)-parseFloat(c.purchasePrice):null;
            return(
              <div key={c.id} style={{background:C.surface,borderRadius:10,padding:"12px 14px",marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div>
                    <div style={{fontSize:15,fontWeight:800,color:C.text}}>{c.playerName}</div>
                    <div style={{fontSize:11,color:C.muted}}>{c.year} {c.brand} {c.set} · {c.gradingCompany} {c.grade}</div>
                    <div style={{fontSize:11,color:C.muted,marginTop:2}}>Cost: {fmtMoney(c.purchasePrice)}{c.lastSalePrice?" · Current last sale: "+fmtMoney(c.lastSalePrice):""}</div>
                  </div>
                  {pnl!=null&&<div style={{fontSize:16,fontWeight:800,color:pnl>=0?C.green:C.red,flexShrink:0}}>{pnl>=0?"+":""}{fmtMoney(pnl)}</div>}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <Fld l="Last Sale Price">
                    <Inp type="number" step="0.01" placeholder="0.00" value={entry.price}
                      onChange={function(e){var v=e.target.value;setPrices(function(prev){var n=Object.assign({},prev);n[c.id]=Object.assign({},n[c.id],{price:v});return n;});}}/>
                  </Fld>
                  <Fld l="Sale Date">
                    <Inp type="date" value={entry.date}
                      onChange={function(e){var v=e.target.value;setPrices(function(prev){var n=Object.assign({},prev);n[c.id]=Object.assign({},n[c.id],{date:v});return n;});}}/>
                  </Fld>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:"16px 20px",borderTop:"1px solid "+C.border}}>
          <button style={BO} onClick={onClose}>Cancel</button>
          <button style={BG} onClick={handleSave}>Save All Prices</button>
        </div>
      </div>
    </div>
  );
}

// ════════════ SELL MODAL ════════════
function SellModal(p){
  var card=p.card,onSell=p.onSell,onClose=p.onClose;
  var [sd,setSd]=useState({price:"",date:new Date().toISOString().slice(0,10)});
  var profit=sd.price&&card.purchasePrice?parseFloat(sd.price)-parseFloat(card.purchasePrice):null;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:C.card,borderRadius:16,width:"100%",maxWidth:420,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+C.border}}>
          <div style={{fontSize:20,fontWeight:800}}>Mark as Sold</div>
          <button onClick={onClose} style={{...BO,padding:"6px 12px"}}>✕</button>
        </div>
        <div style={{padding:20}}>
          <div style={{background:C.surface,borderRadius:10,padding:"14px 16px",marginBottom:18}}>
            <div style={{fontSize:18,fontWeight:800}}>{card.playerName}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>{card.year} {card.brand} {card.set} · {card.gradingCompany} {card.grade}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:4}}>Cost basis: {fmtMoney(card.purchasePrice)}</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <Fld l="Sale Price *"><Inp type="number" step="0.01" placeholder="0.00" value={sd.price} onChange={function(e){setSd(function(prev){return Object.assign({},prev,{price:e.target.value});});}}/></Fld>
            <Fld l="Sale Date"><Inp type="date" value={sd.date} onChange={function(e){setSd(function(prev){return Object.assign({},prev,{date:e.target.value});});}}/></Fld>
          </div>
          {profit!=null&&<div style={{padding:"12px 16px",borderRadius:10,background:profit>=0?"#e8f5ee":"#fdecea"}}><span style={{fontSize:18,fontWeight:800,color:profit>=0?C.green:C.red}}>{profit>=0?"+":""}{fmtMoney(profit)} ({fmtPct(card.purchasePrice?profit/parseFloat(card.purchasePrice)*100:null)})</span></div>}
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:"16px 20px",borderTop:"1px solid "+C.border}}>
          <button style={BO} onClick={onClose}>Cancel</button>
          <button style={BD} onClick={function(){if(sd.price)onSell(sd);}}>Confirm Sale</button>
        </div>
      </div>
    </div>
  );
}

// ════════════ DETAIL MODAL ════════════
function DetailModal(p){

          {!editing?(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>

                {card.alertStatus==="urgent_sale"&&<span style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:3,background:C.red,color:"#fff",letterSpacing:1}}>URGENT SALE</span>}

          <div style={{display:"flex",gap:10,justifyContent:"space-between",padding:"16px 20px",borderTop:"1px solid "+C.border}}>
            <button style={{...BD,padding:"6px 12px",fontSize:12}} onClick={function(){if(window.confirm("Delete this card?"))onDelete(card.id);}}>🗑 Delete</button>
            <div style={{display:"flex",gap:10}}>
              <button style={BO} onClick={function(){setEditing(false);setForm(Object.assign({},card));}}>Cancel</button>
              <button style={BG} onClick={function(){onUpdate(form);}}>✓ Save</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ════════════ SETTINGS MODAL ════════════
function SettingsModal(p){
  var onClose=p.onClose,onResetKey=p.onResetKey;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:C.card,borderRadius:16,width:"100%",maxWidth:400,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px",borderBottom:"1px solid "+C.border}}>
          <div style={{fontSize:20,fontWeight:800}}>⚙ Settings</div>
          <button onClick={onClose} style={{...BO,padding:"6px 12px"}}>✕</button>
        </div>
        <div style={{padding:20}}>
          <div style={{background:C.surface,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>API Key</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Reset if you need to use a different Anthropic API key.</div>
            <button style={{...BD,padding:"8px 14px",fontSize:12}} onClick={onResetKey}>Reset API Key</button>
          </div>
          <div style={{background:C.surface,borderRadius:10,padding:"14px 16px"}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>About</div>
            <div style={{fontSize:12,color:C.muted,lineHeight:1.6}}>Dad &amp; Lad's Card Vault<br/>Graded card inventory tracker<br/>Data stored locally on this device</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ════════════ MAIN APP ════════════
function App(){
  var [apiKey,setApiKey]=useState(null);
  var [profile,setProfile]=useState(null);
  var [view,setView]=useState("dashboard");
  var [mode,setMode]=useState("buy");
  var [dadCards,setDadCards]=useState([]);
  var [owenCards,setOwenCards]=useState([]);
  var [dadWatchlist,setDadWatchlist]=useState([]);
  var [owenWatchlist,setOwenWatchlist]=useState([]);
  var [loading,setLoading]=useState(true);
  var [toasts,setToasts]=useState([]);
  var [showAdd,setShowAdd]=useState(false);
  var [showSell,setShowSell]=useState(null);
  var [showDetail,setShowDetail]=useState(null);
  var [showSettings,setShowSettings]=useState(false);
  var [showBulkPrice,setShowBulkPrice]=useState(false);
  var [refreshing,setRefreshing]=useState(false);
  var [prog,setProg]=useState({current:0,total:0,card:""});
  var [lastRefresh,setLastRefresh]=useState(null);
  var [search,setSearch]=useState("");
  var [fAlert,setFAlert]=useState("all");
  var [fStatus,setFStatus]=useState("all");

  useEffect(function(){
    try{
      var k=localStorage.getItem("cv_api_key");if(k)setApiKey(k);
      var d=lsGet("cv_dad_inventory");if(d)setDadCards(JSON.parse(d.value));
      var o=lsGet("cv_owen_inventory");if(o)setOwenCards(JSON.parse(o.value));
      var dw=lsGet("cv_dad_watchlist");if(dw)setDadWatchlist(JSON.parse(dw.value));
      var ow=lsGet("cv_owen_watchlist");if(ow)setOwenWatchlist(JSON.parse(ow.value));
      var lr=lsGet("cv_last_refresh");if(lr)setLastRefresh(lr.value);
    }catch(e){}
    setLoading(false);
  },[]);

  var myCards=profile==="dad"?dadCards:owenCards;
  var otherCards=profile==="dad"?owenCards:dadCards;
  var otherName=profile==="dad"?"Owen":"Dad";
  var myWatchlist=profile==="dad"?dadWatchlist:owenWatchlist;

  function saveCards(p,cards){
    lsSet("cv_"+p+"_inventory",JSON.stringify(cards));
    if(p==="dad")setDadCards(cards);else setOwenCards(cards);
  }
  function saveWatchlist(p,wl){
    lsSet("cv_"+p+"_watchlist",JSON.stringify(wl));
    if(p==="dad")setDadWatchlist(wl);else setOwenWatchlist(wl);
  }

  function toast(msg,type){
    var id=uid();
    setToasts(function(t){return t.concat([{id:id,msg:msg,type:type||"info"}]);});
    setTimeout(function(){setToasts(function(t){return t.filter(function(x){return x.id!==id;});});},5000);
  }

  function addCards(cards){saveCards(profile,myCards.concat(cards));toast("Added "+cards.length+" card"+(cards.length!==1?"s":"")+"!","success");}
  function updateCard(id,updates){
    var updated=myCards.map(function(x){return x.id===id?Object.assign({},x,updates):x;});
    saveCards(profile,updated);
  }
  function deleteCard(id){saveCards(profile,myCards.filter(function(x){return x.id!==id;}));setShowDetail(null);toast("Card deleted","info");}
  function sellCard(id,sd){saveCards(profile,myCards.map(function(x){return x.id===id?Object.assign({},x,{cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"}):x;}));toast("Card marked as sold","success");}
  function sellBulk(ids,sd){saveCards(profile,myCards.map(function(x){return ids.includes(x.id)?Object.assign({},x,{cardStatus:"sold",salePrice:sd.price,saleDate:sd.date,alertStatus:"normal"}):x;}));}

  async function runRefresh(){
    var active=myCards.filter(function(x){return x.cardStatus==="inventory";});
    if(!active.length){toast("No active cards to refresh","info");return;}
    setRefreshing(true);
    var updated=myCards.slice();
    var alertCount=0;
    for(var i=0;i<active.length;i++){
      var card=active[i];
      setProg({current:i+1,total:active.length,card:card.playerName});
      try{
        var result=await lookupPrice(apiKey,card);
        if(result&&result.salesFound&&result.lastSalePrice){
          var a=alertOf(Object.assign({},card,{lastSalePrice:result.lastSalePrice}));
          if(a!=="normal")alertCount++;
          updated=updated.map(function(x){return x.id===card.id?Object.assign({},x,{lastSalePrice:result.lastSalePrice,lastSaleDate:result.lastSaleDate,estimatedValue:result.avgRecentPrice||result.lastSalePrice,alertStatus:a,priceSource:result.source||"web search"}):x;});
        }
      }catch(e){console.log("Price check error:",e.message);}
      if(i<active.length-1)await new Promise(function(r){setTimeout(r,500);});
    }
    lsSet("cv_"+profile+"_inventory",JSON.stringify(updated));
    if(profile==="dad")setDadCards(updated);else setOwenCards(updated);
    var now=new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    lsSet("cv_last_refresh",now);setLastRefresh(now);
    setRefreshing(false);setProg({current:0,total:0,card:""});
    toast("Done · "+alertCount+" alert"+(alertCount!==1?"s":""),alertCount>0?"info":"success");
  }

  if(loading)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",fontSize:18,color:C.gold,fontWeight:700}}>Loading…</div>;
  if(!apiKey)return <SetupScreen onSave={function(k){localStorage.setItem("cv_api_key",k);setApiKey(k);}}/>;
  if(!profile)return <ProfileScreen counts={{dad:dadCards.length,owen:owenCards.length}} onSelect={function(pr){setProfile(pr);setView("dashboard");}} onSettings={function(){setShowSettings(true);}}/>;

  return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      <Nav profile={profile} mode={mode} view={view} onMode={setMode} onView={function(v){setView(v);setSearch("");setFAlert("all");setFStatus("all");}} onSwitch={function(){setProfile(null);}}/>

      {view==="dashboard"&&<Dashboard cards={myCards} onRefresh={runRefresh} onAdd={function(){setShowAdd(true);}} refreshing={refreshing} prog={prog} lastRefresh={lastRefresh} onExport={function(){exportCSV(myCards);toast("CSV downloaded!","success");}} onBulkPrice={function(){setShowBulkPrice(true);}}/>}
      {(view==="inventory"||view==="browse")&&<InventoryView cards={view==="browse"?otherCards:myCards} onAdd={function(){setShowAdd(true);}} onSell={function(x){setShowSell(x);}} onView={function(x){setShowDetail(x);}} mode={mode} readOnly={view==="browse"} ownerName={otherName} search={search} setSearch={setSearch} fAlert={fAlert} setFAlert={setFAlert} fStatus={fStatus} setFStatus={setFStatus}/>}
      {view==="sell_rank"&&<SellRankView cards={myCards} onView={function(x){setShowDetail(x);}}/>}
      {view==="watchlist"&&<WatchlistView apiKey={apiKey} watchlist={myWatchlist} onUpdate={function(wl){saveWatchlist(profile,wl);}} toast={toast}/>}

      {showAdd&&<AddModal apiKey={apiKey} mode={mode} myCards={myCards} onAdd={addCards} onSellBulk={sellBulk} onClose={function(){setShowAdd(false);}} toast={toast}/>}
      {showSell&&<SellModal card={showSell} onSell={function(sd){sellCard(showSell.id,sd);setShowSell(null);}} onClose={function(){setShowSell(null);}}/>}
      {showDetail&&<DetailModal card={showDetail} readOnly={view==="browse"} onClose={function(){setShowDetail(null);}} onUpdate={function(u){updateCard(showDetail.id,u);setShowDetail(Object.assign({},showDetail,u));toast("Saved","success");}} onDelete={deleteCard}/>}
      {showBulkPrice&&<BulkPriceModal cards={myCards} onSave={function(updated){saveCards(profile,updated);toast("Prices saved!","success");}} onClose={function(){setShowBulkPrice(false);}}/>}
      {showSettings&&<SettingsModal onClose={function(){setShowSettings(false);}} onResetKey={function(){localStorage.removeItem("cv_api_key");setApiKey(null);setShowSettings(false);}}/>}

      <div style={{position:"fixed",bottom:20,right:20,display:"flex",flexDirection:"column",gap:8,zIndex:200,maxWidth:300}}>
        {toasts.map(function(t){return <div key={t.id} style={{background:C.card,borderLeft:"4px solid "+(t.type==="success"?C.green:t.type==="error"?C.red:C.gold),borderRadius:10,padding:"12px 16px",fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.15)"}}>{t.msg}</div>;})}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
</html>
